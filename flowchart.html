<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Design Diagrammer — TriNetX → editorial schematic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper:   #f9f7f1;
    --ink:     #2f2f2f;
    --muted:   #5a5a5a;
    --accent:  #8b0000;
    --hairline:#c4c0b6;
    --card:    #ffffff;
    --sans:    'Source Sans 3', system-ui, sans-serif;
    --serif:   'Newsreader', Georgia, serif;
    --mono:    'Source Sans 3', ui-monospace, monospace;
  }
  body { font-family: var(--sans); background: var(--paper); color: var(--ink); }
  header.top {
    padding: 1.4rem 2rem 1.1rem; border-bottom: 1px solid var(--hairline);
    display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
  }
  header.top h1 { font-family: var(--serif); font-weight: 400; font-size: 1.55rem; letter-spacing: -0.02em; }
  header.top .sub { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(360px, 460px) 1fr; gap: 0; min-height: calc(100vh - 70px); }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  .left { border-right: 1px solid var(--hairline); padding: 1.2rem 1.4rem 3rem; }
  .right { padding: 1.2rem 1.6rem 3rem; }

  .tabs { display: flex; gap: 0; border: 1px solid var(--hairline); border-radius: 8px; overflow: hidden; margin-bottom: 1rem; }
  .tabs button {
    flex: 1; padding: 0.5rem 0.3rem; border: 0; background: var(--card); color: var(--muted);
    font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
  }
  .tabs button.active { background: var(--ink); color: var(--paper); }
  .pane { display: none; margin-bottom: 1.2rem; }
  .pane.active { display: block; }

  .drop {
    border: 1.5px dashed var(--hairline); border-radius: 10px; background: var(--card);
    padding: 1.6rem 1rem; text-align: center; cursor: pointer; transition: border-color .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); }
  .drop p { font-size: 0.82rem; color: var(--muted); }
  .drop p b { color: var(--ink); font-weight: 600; }
  textarea {
    width: 100%; min-height: 130px; border: 1px solid var(--hairline); border-radius: 8px;
    padding: 0.6rem; font-family: var(--mono); font-size: 0.72rem; resize: vertical; background: var(--card); color: var(--ink);
  }
  .btn {
    display: inline-block; border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 0.5rem 0.9rem; border-radius: 7px; cursor: pointer; margin-top: 0.6rem;
  }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn.accent { background: var(--accent); border-color: var(--accent); }
  .btn:hover { opacity: 0.88; }
  .status { font-family: var(--mono); font-size: 0.66rem; color: var(--muted); margin-top: 0.55rem; min-height: 1em; }
  .status.err { color: #b3401e; }

  fieldset { border: 1px solid var(--hairline); border-radius: 10px; padding: 0.8rem 0.9rem 1rem; margin-bottom: 1rem; background: var(--card); }
  legend { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); padding: 0 0.4rem; }
  label.f { display: block; font-size: 0.7rem; color: var(--muted); margin: 0.55rem 0 0.15rem; }
  input[type=text], input[type=number], select {
    width: 100%; border: 1px solid var(--hairline); border-radius: 6px; padding: 0.38rem 0.5rem;
    font-family: var(--sans); font-size: 0.8rem; background: #fff; color: var(--ink);
  }
  input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .row3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 0.5rem; }
  .crit { display: grid; grid-template-columns: 92px 1fr 1fr 26px; gap: 0.4rem; align-items: center; margin-top: 0.4rem; }
  .crit select { font-size: 0.7rem; padding: 0.3rem 0.3rem; }
  .crit input { font-size: 0.74rem; }
  .xbtn { border: 1px solid var(--hairline); background: transparent; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 0.8rem; line-height: 1; padding: 0.28rem 0; text-align: center; }
  .xbtn:hover { color: #b3401e; border-color: #b3401e; }
  .addbtn { border: 0; background: transparent; color: var(--accent); font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.08em; cursor: pointer; margin-top: 0.5rem; text-transform: uppercase; }
  .cohorthead { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.2rem; }

  .previewbar { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
  .previewbar .spacer { flex: 1; }
  .previewbar .laylabel { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  textarea.mini { min-height: 64px; font-family: var(--sans); font-size: 0.78rem; }
  .figurewrap { border: 1px solid var(--hairline); border-radius: 12px; background: var(--card); padding: 1.2rem; overflow-x: auto; }
  .figurewrap svg { display: block; width: 100%; height: auto; min-width: 760px; }
  details.codes { margin-top: 1rem; border: 1px solid var(--hairline); border-radius: 10px; background: var(--card); padding: 0.7rem 1rem; }
  details.codes summary { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
  details.codes .codeblock { font-family: var(--mono); font-size: 0.68rem; color: var(--ink); white-space: pre-wrap; margin: 0.5rem 0 0.9rem; }
  details.codes h4 { font-family: var(--sans); font-size: 0.78rem; font-weight: 600; margin-top: 0.8rem; }
  details.codes h5 { font-family: var(--sans); font-size: 0.72rem; font-weight: 500; color: var(--muted); margin-top: 0.5rem; }
</style>
</head>
<body>
<header class="top">
  <h1>Study Design Diagrammer</h1>
  <span class="sub">TriNetX Compare Outcomes &rarr; study design diagram</span>
</header>
<main>
  <section class="left">
    <div class="tabs">
      <button id="tab-upload" class="active" onclick="switchTab('upload')">Upload DOCX</button>
      <button id="tab-paste" onclick="switchTab('paste')">Paste text</button>
      <button id="tab-manual" onclick="switchTab('manual')">Manual</button>
    </div>

    <div class="pane active" id="pane-upload">
      <div class="drop" id="drop" onclick="document.getElementById('file').click()">
        <p><b>Drop a TriNetX Compare Outcomes .docx</b><br>or click to choose a file</p>
      </div>
      <input type="file" id="file" accept=".docx" style="display:none">
      <div class="status" id="status-upload"></div>
    </div>

    <div class="pane" id="pane-paste">
      <textarea id="paste" placeholder="Paste the full text of a TriNetX report, or the Methods/Abstract of a manuscript…"></textarea>
      <button class="btn" onclick="parsePasted()">Parse text</button>
      <div class="status" id="status-paste"></div>
    </div>

    <div class="pane" id="pane-manual">
      <p style="font-size:0.8rem;color:var(--muted);">Edit the form below directly — the diagram updates live. Start from a blank slate or from the example.</p>
      <button class="btn ghost" onclick="loadBlank()">Start blank</button>
    </div>

    <div id="form"></div>
  </section>

  <section class="right">
    <div class="previewbar">
      <button class="btn ghost" onclick="loadExample()">Load example</button>
      <span class="spacer"></span>
      <span class="laylabel">Layout</span>
      <button class="btn" id="lay-flow" onclick="setLayout('flowchart')">Journal flowchart</button>
      <button class="btn ghost" id="lay-edit" onclick="setLayout('editorial')">Editorial schematic</button>
      <button class="btn" onclick="exportSvg()">SVG</button>
      <button class="btn" onclick="exportPng()">PNG</button>
      <button class="btn accent" onclick="exportHtml()">Standalone HTML</button>
    </div>
    <div class="figurewrap" id="figurewrap"></div>
    <details class="codes" id="codespanel" style="display:none">
      <summary>Full code lists per cohort</summary>
      <div id="codesbody"></div>
    </details>
  </section>
</main>

<script>
'use strict';
/* ============================================================
   Section 1 — DOM-free core (parsing, derivation, SVG building)
   ============================================================ */

var VOCAB_PRETTY = {
  'ICD10CM': 'ICD-10-CM', 'ICD10PCS': 'ICD-10-PCS', 'ICD9CM': 'ICD-9-CM', 'ICD9PCS': 'ICD-9-PCS',
  'TNX': 'TriNetX', 'CPT': 'CPT', 'HCPCS': 'HCPCS', 'RXNORM': 'RxNorm', 'ATC': 'ATC',
  'LOINC': 'LOINC', 'SNOMED': 'SNOMED CT', 'CVX': 'CVX', 'NDC': 'NDC'
};
var CODE_RE = /^(UMLS:[A-Z0-9.]+:[A-Z0-9.]+|TNX:[A-Z0-9.]+|RXNORM:\S+|ATC:\S+|CPT:\S+|HCPCS:\S+|LOINC:\S+|SNOMED:\S+|ICD9\S*:\S+)\s*(.*)$/;
var TERM_TYPES = ['demographics','diagnosis','procedure','laboratory','medication','visit','genomics','cohort','vital signs'];

function vocabOf(code) {
  var parts = code.split(':');
  if (parts[0] === 'UMLS' && parts.length >= 3) return VOCAB_PRETTY[parts[1]] || parts[1];
  return VOCAB_PRETTY[parts[0]] || parts[0];
}
function shortCode(code) {
  var parts = code.split(':');
  return parts[parts.length - 1];
}

/* ---- TriNetX structured parser (paragraph lines -> object) ---- */
function parseCriteriaBlock(lines) {
  var groups = [], curGroup = null, curSub = null, pendingLogic = null, i = 0;
  while (i < lines.length) {
    var ln = lines[i], low = ln.toLowerCase();
    if (low === 'must have' || low === 'cannot have' || low === 'must not have') {
      var logic = (low.indexOf('cannot') === 0 || low.indexOf('must not') === 0) ? 'cannot have' : 'must have';
      if (curSub && !curSub.logic) curSub.logic = logic;
      else if (!curSub) pendingLogic = logic;
      i++; continue;
    }
    if (low === 'any of') { if (curSub) curSub.anyOf = true; i++; continue; }
    var m = /^Group (\d+)([A-Z]?)\s*(.*)$/.exec(ln);
    if (m) {
      var gnum = m[1], sub = m[2], rest = (m[3] || '').trim();
      if (sub) {
        curSub = { name: 'Group ' + gnum + sub + (rest ? ' ' + rest : ''), logic: pendingLogic, anyOf: false, terms: [], constraints: [] };
        pendingLogic = null;
        if (curGroup) curGroup.subgroups.push(curSub);
      } else {
        curGroup = { name: 'Group ' + gnum + (rest ? ' ' + rest : ''), subgroups: [] };
        groups.push(curGroup);
        curSub = null;
      }
      i++; continue;
    }
    if (ln === 'Ungrouped terms') {
      curGroup = { name: 'Ungrouped terms', subgroups: [{ name: 'Ungrouped', logic: pendingLogic, anyOf: false, terms: [], constraints: [] }] };
      curSub = curGroup.subgroups[0];
      groups.push(curGroup);
      pendingLogic = null;
      i++; continue;
    }
    if (low === 'date constraint' || low === 'event relationship') {
      var txt = (i + 1 < lines.length) ? lines[i + 1] : '';
      var target = curSub || (curGroup && curGroup.subgroups.length ? curGroup.subgroups[curGroup.subgroups.length - 1] : null);
      if (target) target.constraints.push({ kind: low === 'date constraint' ? 'date' : 'relationship', text: txt });
      i += 2; continue;
    }
    if (TERM_TYPES.indexOf(low) >= 0) {
      var code = (i + 1 < lines.length) ? lines[i + 1] : '';
      var label = (i + 2 < lines.length) ? lines[i + 2] : '';
      var cm = CODE_RE.exec(code), vocabCode = code;
      if (cm) { vocabCode = cm[1]; label = (cm[2] ? cm[2] + ' ' : '') + label; }
      if (curSub) curSub.terms.push({ type: low, code: vocabCode, label: label.trim() });
      i += 3; continue;
    }
    i++;
  }
  return groups;
}

function parseTrinetx(lines) {
  var j = lines.join('\n');
  var out = { meta: {}, cohorts: [], window: {}, outcomes: [], psm: null };
  var m;

  m = /named\s+([\s\S]+?),\s*generated by/.exec(j);
  if (m) out.meta.title = m[1].replace(/\s+/g, ' ').trim();
  m = /network\s*\n?\s*called\s*\n?\s*([\s\S]+?)\./.exec(j);
  if (m) out.meta.network = m[1].replace(/\s+/g, ' ').trim();
  m = /included\s*\n?\s*(\d+)\s*\n?\s*HCO/.exec(j);
  if (m) out.meta.hcos = parseInt(m[1], 10);
  m = /Created by TriNetX on\s*\n?\s*(.+)/.exec(j);
  if (m) out.meta.date = m[1].trim();

  m = /Cohort A \(([\d,]+) patients?\) named\s*\n?\s*([\s\S]+?)\s*\n?\s*and\s*\n?\s*Cohort B \(([\d,]+) patients?\) named\s*\n?\s*([\s\S]+?)\./.exec(j);
  if (m) {
    out.cohorts = [
      { name: m[2].replace(/\s+/g, ' ').trim(), n: parseInt(m[1].replace(/,/g, ''), 10), groups: [] },
      { name: m[4].replace(/\s+/g, ' ').trim(), n: parseInt(m[3].replace(/,/g, ''), 10), groups: [] }
    ];
  }

  var setupM = /Analysis\s*\n?\s*Setup/.exec(j);
  var setupAt = setupM ? setupM.index : j.length;
  var secs = [], sm;
  var secRe = /Query Criteria for\s*\n?\s*Cohort (\d) \(query name:/g;
  while ((sm = secRe.exec(j)) !== null) { if (sm.index < setupAt) secs.push(sm); }
  for (var si = 0; si < secs.length && si < out.cohorts.length; si++) {
    var start = secs[si].index + secs[si][0].length;
    var end = (si + 1 < secs.length) ? secs[si + 1].index : setupAt;
    var block = j.slice(start, end).split('\n');
    var cut = 0;
    for (var k = 0; k < block.length; k++) { if (block[k].indexOf('table below') >= 0) { cut = k + 1; break; } }
    out.cohorts[si].groups = parseCriteriaBlock(block.slice(cut));
  }

  m = /started (\d+) days? after the first occurrence of the index event and ended ([\d,]+) days? after/.exec(j);
  if (m) out.window = { startDays: parseInt(m[1], 10), endDays: parseInt(m[2].replace(/,/g, ''), 10) };

  var om = /Outcome Definitions\s*\n([\s\S]*?)(?:\nPropensity Score Matching|\nAppendix|\nResults)/.exec(j);
  if (om) {
    var oblock = om[1].split('\n');
    for (var k2 = 1; k2 < oblock.length; k2++) {
      if (oblock[k2] === 'Outcome definition') {
        var name = oblock[k2 - 1], terms = 0;
        for (var k3 = k2 + 1; k3 < oblock.length; k3++) {
          var l2 = oblock[k3];
          if (l2.indexOf('Settings for') === 0) break;
          if (CODE_RE.test(l2) || l2 === 'Demographics') terms++;
        }
        out.outcomes.push({ name: name, termCount: Math.max(terms, 1) });
      }
    }
  }

  var pm = /patient count before and after propensity score matching\s*\n([\s\S]*?)(?:Propensity score density|Cohort 1 \(N)/.exec(j);
  if (pm) {
    var plines = pm[1].split('\n'), psm = [];
    var rowRe = /^(\d) - (.+)$/;
    for (var k4 = 0; k4 < plines.length; k4++) {
      var rm = rowRe.exec(plines[k4]);
      if (rm && k4 + 2 < plines.length + 1) {
        var before = parseInt((plines[k4 + 1] || '').replace(/,/g, ''), 10);
        var after = parseInt((plines[k4 + 2] || '').replace(/,/g, ''), 10);
        if (!isNaN(before) && !isNaN(after)) psm.push({ cohort: parseInt(rm[1], 10), name: rm[2], before: before, after: after });
      }
    }
    if (psm.length) out.psm = psm;
  }

  // PSM matching variables: rows are '12' / code / name triples in the characteristics table
  var cm = /characteristics before propensity score matching\s*\n([\s\S]*?)(?:characteristics after propensity|\nResults|\nOutcome|\nAppendix)/.exec(j);
  if (cm) {
    var cl = cm[1].split('\n'), vars = [];
    for (var k5 = 0; k5 + 2 < cl.length; k5++) {
      if (/^12$/.test(cl[k5]) && /^[A-Z0-9][A-Z0-9.\-]{0,11}$/.test(cl[k5 + 1]) && /[A-Za-z]/.test(cl[k5 + 2]) && cl[k5 + 2].length > 2) {
        if (vars.indexOf(cl[k5 + 2]) < 0) vars.push(cl[k5 + 2]);
        k5 += 2;
      }
    }
    out.matchVars = vars;
  }

  // analysis types per outcome settings ("Risk analysis", "Kaplan - Meier survival analysis", ...)
  var analyses = [];
  var anRe = /\n(Risk analysis|Kaplan - Meier survival analysis|Number of Instances analysis|Lab result distribution|Laboratory Results Analysis)\n/g, anM;
  while ((anM = anRe.exec(j)) !== null) { if (analyses.indexOf(anM[1]) < 0) analyses.push(anM[1]); }
  out.analyses = analyses;
  return out;
}

/* ---- Manuscript heuristic pre-fill ---- */
function heuristicParse(text) {
  var t = text.replace(/\s+/g, ' ');
  var out = { meta: {}, cohorts: [], window: {}, outcomes: [], psm: null };
  var m;

  var firstLine = text.split('\n').map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 20; })[0];
  if (firstLine) out.meta.title = firstLine.replace(/[.:]\s*$/, '');

  m = /(TriNetX[^.]*Network)/.exec(t);
  if (m) out.meta.network = m[1];

  // cohort sizes: "443 patients were included in each CAS cohort" / "633 patients in each CEA cohort"
  var sizeRe = /([\d,]+)\s+patients\s+(?:were included |remained |)in each\s+([A-Za-z-]+)\s+cohort/g, sm2;
  var sizes = [];
  while ((sm2 = sizeRe.exec(t)) !== null) sizes.push({ n: parseInt(sm2[1].replace(/,/g, ''), 10), label: sm2[2] });

  // exposure group names: "The CAS-GLP-1RA group included patients receiving ..."
  var expRe = /The\s+([A-Za-z][A-Za-z0-9-]*(?:GLP-1RA|exposed|treated)[A-Za-z0-9-]*)\s+group/gi, em;
  var expNames = [];
  while ((em = expRe.exec(t)) !== null) { if (expNames.indexOf(em[1]) < 0) expNames.push(em[1]); }

  if (sizes.length) {
    var base = sizes[0].label;
    var pos = null, neg = null, en;
    for (var q = 0; q < expNames.length; q++) {
      en = expNames[q];
      if (en.indexOf(base + '-') === 0) {
        if (/non|no[- ]|unexposed|control/i.test(en)) neg = en; else pos = en;
      }
    }
    if (!pos) pos = base + ' exposed';
    if (!neg) neg = base + ' unexposed';
    var afterMatching = /after (?:1:1 )?(?:propensity[- ]score )?matching/i.test(t);
    out.cohorts = [
      { name: pos, n: sizes[0].n, nAfter: afterMatching ? sizes[0].n : null, groups: [] },
      { name: neg, n: sizes[0].n, nAfter: afterMatching ? sizes[0].n : null, groups: [] }
    ];
  }

  m = /continued through\s+(\d+)\s+years?\s*\(([\d,]+)\s*days?\)/.exec(t);
  if (m) out.window.endDays = parseInt(m[2].replace(/,/g, ''), 10);
  else { m = /(\d+)[- ]year follow/i.exec(t); if (m) out.window.endDays = parseInt(m[1], 10) * 365; }
  m = /began after the\s+(\d+)[- ]month/.exec(t);
  if (m) out.window.startDays = parseInt(m[1], 10) * 30;
  else { m = /(?:started|beginning)\s+(\d+)\s+days?\s+after/i.exec(t); if (m) out.window.startDays = parseInt(m[1], 10); }

  m = /Outcomes included\s+([^.]+)\./i.exec(t);
  if (m) {
    var parts = m[1].split(/,|\s+and\s+/).map(function (s) { return s.trim().replace(/^a\s+/, ''); })
      .filter(function (s) { return s.length > 2; });
    out.outcomes = parts.map(function (p) { return { name: p.charAt(0).toUpperCase() + p.slice(1), termCount: 1 }; });
  }
  if (/propensity[- ]score|PSM was performed/i.test(t)) out.psm = [];
  return out;
}

/* ---- Derive the schematic data model from a parse result ---- */
function subShortName(sub) {
  var s = sub.name.replace(/^Group \d+[A-Z]?\s*/, '').trim();
  return s || 'Ungrouped';
}
function criterionSummary(sub) {
  // concise label + detail for one subgroup
  var short = subShortName(sub);
  var label = short, detail = '';
  if (short === 'Ungrouped' && sub.terms.length) {
    var tm = sub.terms[0];
    var am = /at least (\d+) years/.exec(tm.label);
    if (tm.type === 'demographics' && am) { label = 'Age \u2265 ' + am[1] + ' years'; detail = 'demographic'; }
    else { label = tm.label.length > 44 ? tm.label.slice(0, 44) + '\u2026' : tm.label; detail = tm.type; }
  } else {
    var vocabs = [], vi;
    for (var ti = 0; ti < sub.terms.length; ti++) {
      vi = vocabOf(sub.terms[ti].code);
      if (vocabs.indexOf(vi) < 0) vocabs.push(vi);
    }
    var n = sub.terms.length;
    var typeWord = sub.terms.length && sub.terms[0].type === 'laboratory' ? 'lab' :
      (sub.terms.length && sub.terms[0].type === 'procedure' ? 'procedure' : 'code');
    detail = n + ' ' + vocabs.join(' + ') + ' ' + typeWord + (n === 1 ? '' : 's');
  }
  // date constraint
  for (var ci = 0; ci < (sub.constraints || []).length; ci++) {
    var c = sub.constraints[ci];
    if (c.kind === 'date') {
      var dm = /on or after (.+)$/.exec(c.text);
      if (dm) detail += (detail ? ' \u00b7 ' : '') + 'on/after ' + dm[1];
    }
  }
  return { key: short, label: label, detail: detail, logic: sub.logic || 'must have',
           codes: sub.terms.map(function (t) { return t.code; }).sort() };
}
function sameCodes(a, b) {

  if (st.psm) {

  y += 34;

  var head = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + Math.round(y) + '" viewBox="0 0 ' + W + ' ' + Math.round(y) + '">';
  head += '<rect width="' + W + '" height="' + Math.round(y) + '" fill="' + C.paper + '"/>';

/* ============================================================
   Journal flowchart layout (vertical CONSORT-style, navy/blue)
   ============================================================ */
var JC = { bg: '#f7fafd', fill: '#e3eef9', navy: '#1b3a6b', dark: '#16305e', white: '#ffffff' };

function jArrow(x, y1, y2) {
  return '<line x1="' + x + '" y1="' + y1 + '" x2="' + x + '" y2="' + (y2 - 7) + '" stroke="' + JC.navy + '" stroke-width="2"/>' +
    '<path d="M ' + (x - 6) + ' ' + (y2 - 8) + ' L ' + x + ' ' + y2 + ' L ' + (x + 6) + ' ' + (y2 - 8) + ' Z" fill="' + JC.navy + '"/>';
}

/* box content (centered bold header + optional subheader + left-aligned bullets);

function jBox(cx, y, w, header, bullets, opts) {
  opts = opts || {};
  var dark = !!opts.dark, padX = 26, padT = 14, padB = 14;
  var bulletFont = '15px ' + JF.sans;
  var textColor = dark ? JC.white : JC.navy;
  var ty = y + padT;
  var inner = '';
  if (header) {
    var hLines = wrapText(header, 'bold 17px ' + JF.sans, w - padX * 2, measureGlobal);
    hLines.forEach(function (l) {
      ty += 20;
      inner += '<text x="' + cx + '" y="' + (ty - 7) + '" text-anchor="middle" font-family="' + JF.sans + '" font-size="17" font-weight="bold" fill="' + textColor + '">' + esc(l) + '</text>';
    });
    ty += 2;
  }
  if (opts.subheader) {
    ty += 16;
    inner += '<text x="' + cx + '" y="' + ty + '" text-anchor="middle" font-family="' + JF.sans + '" font-size="14" font-weight="bold" fill="' + textColor + '">' + esc(opts.subheader) + '</text>';
  }
  (bullets || []).forEach(function (b) {
    var lines = wrapText(b, bulletFont, w - padX * 2 - 16, measureGlobal);
    lines.forEach(function (l, li) {
      ty += 19;
      inner += '<text x="' + (cx - w / 2 + padX + (li ? 14 : 0)) + '" y="' + ty + '" font-family="' + JF.sans + '" font-size="15" fill="' + textColor + '">' + (li ? '' : '\u2022  ') + esc(l) + '</text>';
    });
    ty += 3;
  });
  var h = (ty - y) + padB;
  var frame = '<rect x="' + (cx - w / 2) + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="9" fill="' + (dark ? JC.dark : JC.fill) + '" stroke="' + JC.navy + '" stroke-width="' + (dark ? 0 : 1.6) + '"/>';

/* box with extra centered lines below the header (e.g. "(n = 8,305)") */
function jBoxLines(cx, y, w, header, extraLines, opts) {
  opts = opts || {};
  var dark = !!opts.dark;
  var base = jBox(cx, y, w, header, [], opts);
  var textColor = dark ? JC.white : JC.navy;
  var extra = '', ey = y + base.h - 4;
  extraLines.forEach(function (l) {
    ey += 19;
    extra += '<text x="' + cx + '" y="' + ey + '" text-anchor="middle" font-family="' + JF.sans + '" font-size="15.5" font-weight="' + (opts.boldExtra === false ? 'normal' : 'bold') + '" fill="' + textColor + '">' + esc(l) + '</text>';
  });

  var frame = '<rect x="' + (cx - w / 2) + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="9" fill="' + (dark ? JC.dark : JC.fill) + '" stroke="' + JC.navy + '" stroke-width="' + (dark ? 0 : 1.6) + '"/>';

/* multi-column bullet grid (for matching variables); row heights adapt to wrapped items */
function jBulletGrid(cx, y, w, items, cols) {
  var colW = (w - 40) / cols, s = '';
  var rows = [];
  items.forEach(function (it, i) {
    var row = Math.floor(i / cols);
    if (!rows[row]) rows[row] = [];
    rows[row].push({ col: i % cols, lines: wrapText(it, '14.5px ' + JF.sans, colW - 26, measureGlobal) });
  });
  var yy = y;
  rows.forEach(function (rowItems) {
    var maxLines = 1;
    rowItems.forEach(function (ri) { maxLines = Math.max(maxLines, ri.lines.length); });
    rowItems.forEach(function (ri) {
      var x = cx - w / 2 + 20 + ri.col * colW;
      ri.lines.forEach(function (l, li) {
        s += '<text x="' + x + '" y="' + (yy + 12 + li * 16) + '" font-family="' + JF.sans + '" font-size="14.5" fill="' + JC.navy + '">' + (li ? '   ' : '\u2022  ') + esc(l) + '</text>';
      });
    });
    yy += maxLines * 16 + 8;
  });

}

var measureGlobal = null; // set by buildFlowchartSvg

function buildFlowchartSvg(st, measure) {
  measureGlobal = measure;
  var W = 1000, cx = W / 2, s = '';

  var y = 46;

  }

  // exclusions box
  var exc = st.shared.filter(function (c2) { return c2.logic === 'cannot have'; })
    .map(function (c2) { return c2.label + (c2.detail ? ' (' + c2.detail + ')' : ''); });
  if (exc.length) {
    var xb = jBox(cx, y + 26, boxW, 'Exclusions', exc, {});
    s += jArrow(cx, y, y + 26); s += xb.svg; y += 26 + xb.h;
  }

  // eligible cohort
  if (st.eligibleN != null) {
    var ec = jBoxLines(cx, y + 26, 300, 'Eligible Cohort', ['(n = ' + fmtN(st.eligibleN) + ')'], {});
    s += jArrow(cx, y, y + 26);
    s += ec.svg;
    y += 26 + ec.h;
  }

  // split to two cohort boxes
  var cw = 300, cgap = 120;
  var c1x = cx - (cw + cgap) / 2, c2x = cx + (cw + cgap) / 2;
  var splitY = y + 30;
  s += '<path d="M ' + cx + ' ' + y + ' L ' + cx + ' ' + (y + 14) + ' M ' + c1x + ' ' + (y + 14) + ' L ' + c2x + ' ' + (y + 14) + '" stroke="' + JC.navy + '" stroke-width="2" fill="none"/>';
  s += jArrow(c1x, y + 14, splitY); s += jArrow(c2x, y + 14, splitY);
  var ch = 0;
  st.cohorts.slice(0, 2).forEach(function (coh, ci) {
    var bx = ci === 0 ? c1x : c2x;
    var nm = coh.short || coh.name;
    var hdr = /cohort/i.test(nm) ? nm : nm + ' Cohort';
    var nTxt = coh.nBefore != null ? '(n = ' + fmtN(coh.nBefore) + ')' : '';

    s += cb.svg;
    ch = Math.max(ch, cb.h);

  var moreBelow = st.psm || (st.subgroups && st.subgroups.length) || st.outcomes.length || st.statsText;
  if (moreBelow) {
    var mergeY = y + 30;
    s += '<path d="M ' + c1x + ' ' + y + ' L ' + c1x + ' ' + (y + 14) + ' L ' + c2x + ' ' + (y + 14) + ' L ' + c2x + ' ' + y + '" stroke="' + JC.navy + '" stroke-width="2" fill="none"/>';
    s += jArrow(cx, y + 14, mergeY);

  }

  if (st.psm) {
    var pw = 720;

    var shown = mv.length > 12 ? mv.slice(0, 11).concat(['+ ' + (mv.length - 11) + ' more']) : mv;
    var pb = jBox(cx, y, pw, '1:1 Propensity Score Matching', [], { subheader: shown.length ? 'Matching Variables' : '' });
    var ph = pb.h;
    var inner2 = '';
    if (shown.length) {
      var cols = Math.min(4, Math.max(2, Math.ceil(shown.length / 3)));
      var grid = jBulletGrid(cx, y + ph - 6, pw, shown, cols);
      inner2 = grid.svg;
      ph += grid.h;
    }
    s += '<rect x="' + (cx - pw / 2) + '" y="' + y + '" width="' + pw + '" height="' + ph + '" rx="9" fill="' + JC.fill + '" stroke="' + JC.navy + '" stroke-width="1.6"/>' + pb.inner + inner2;

    var mLine = st.cohorts.slice(0, 2).map(function (c2) {

      parts += '<path d="M ' + cx + ' ' + y + ' L ' + cx + ' ' + (y + 16) + ' M ' + firstX + ' ' + (y + 16) + ' L ' + lastX + ' ' + (y + 16) + '" stroke="' + JC.navy + '" stroke-width="2" fill="none"/>';

    var ow = 760;

      var yy = colY + 8, cnt = 0;
      col[2].forEach(function (o2) {
        var ls = wrapText(o2, '15px ' + JF.sans, ow / 2 - 80, measure);
        ls.forEach(function (l, li) {
          yy += 19;
          inner3 += '<text x="' + (col[0] + (li ? 14 : 0)) + '" y="' + yy + '" font-family="' + JF.sans + '" font-size="15" fill="' + JC.navy + '">' + (li ? '' : '\u2022  ') + esc(l) + '</text>';

    s += jArrow(cx, y, y + 26);
    s += '<rect x="' + (cx - ow / 2) + '" y="' + (y + 26) + '" width="' + ow + '" height="' + oh + '" rx="9" fill="' + JC.fill + '" stroke="' + JC.navy + '" stroke-width="1.6"/>' + ob.inner + inner3;

    y += 26 + sb2.h;

    '<rect width="' + W + '" height="' + Math.round(y) + '" fill="' + JC.bg + '"/>' + s + '</svg>';

      '<div class="row2"><div><label class="f">Eligible cohort N (before split)</label><input type="number" data-path="eligibleN" value="' + (st.eligibleN == null ? '' : st.eligibleN) + '" placeholder="auto = sum of cohort Ns"></div>' +
      '<div><label class="f">Date range</label><input type="text" data-path="dateRange" placeholder="January 2016 \u2013 July 2026" value="' + esc(st.dateRange) + '"></div></div>' +
      '<label class="f">Matching variables (one per line; if more than 12, the figure shows the first 11 + \u201c+ N more\u201d)</label><textarea class="mini" data-path="matchVars" placeholder="Demographics&#10;Vascular risk factors">' + esc((st.matchVars || []).join('\n')) + '</textarea>' +
      '<label class="f">Subgroup analyses (up to 3 shown)</label>' +
      (st.subgroups || []).map(function (sg, i) {
        return '<div class="crit" style="grid-template-columns:1.1fr 1fr 1fr 26px">' +
          '<input type="text" placeholder="Name" value="' + esc(sg.name) + '" data-path="subgroups.' + i + '.name">' +
          '<input type="text" placeholder="Line 1 (e.g. MMAE: 373)" value="' + esc(sg.lineA) + '" data-path="subgroups.' + i + '.lineA">' +
          '<input type="text" placeholder="Line 2 (e.g. MM: 373)" value="' + esc(sg.lineB) + '" data-path="subgroups.' + i + '.lineB">' +
          '<button class="xbtn" data-remove="subgroups.' + i + '" title="Remove">\u00d7</button></div>';
      }).join('') +
      '<button class="addbtn" data-add="subgroups">+ add subgroup</button>' +
      '<label class="f">Statistical analysis footer (separate items with \u2022)</label><input type="text" data-path="statsText" placeholder="Kaplan\u2013Meier \u2022 Cox models \u2022 Hazard ratios (95% CI)" value="' + esc(st.statsText) + '"></fieldset>';

    document.getElementById('form').innerHTML = h;
  }

  function setPath(obj, path, val) {
    var parts = path.split('.'), o = obj;
    for (var i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    var last = parts[parts.length - 1];
    if (typeof o[last] === 'number' || o[last] === null) {
      if (val === '') o[last] = null;
      else { var n = Number(val); o[last] = isNaN(n) ? val : n; }
    } else o[last] = val;
  }

  var renderTimer = null;
  function scheduleRender() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(renderDiagram, 120);
  }

  function renderDiagram() {
    if (!state) return;
    var svg = state.layout === 'editorial' ? buildSchematicSvg(state, measure) : buildFlowchartSvg(state, measure);
    document.getElementById('figurewrap').innerHTML = svg;
    document.getElementById('lay-flow').className = 'btn' + (state.layout !== 'editorial' ? '' : ' ghost');
    document.getElementById('lay-edit').className = 'btn' + (state.layout === 'editorial' ? '' : ' ghost');
  }
  window.setLayout = function (l) { state.layout = l; renderDiagram(); };

  function renderCodesPanel(parsed) {
    var panel = document.getElementById('codespanel');
    if (!parsed || !parsed.cohorts || !parsed.cohorts.length || !parsed.cohorts[0].groups) { panel.style.display = 'none'; return; }
    var h = '';
    parsed.cohorts.forEach(function (c, ci) {
      h += '<h4>Cohort ' + String.fromCharCode(65 + ci) + ' \u2014 ' + esc(c.name) + '</h4>';
      (c.groups || []).forEach(function (g) {
        g.subgroups.forEach(function (sg) {
          h += '<h5>' + esc(sg.name) + ' \u00b7 ' + esc(sg.logic || 'must have') + (sg.anyOf ? ' \u00b7 any of' : '') + '</h5><div class="codeblock">';
          sg.terms.forEach(function (t) { h += esc(shortCode(t.code)) + '  ' + esc(t.label) + '  [' + esc(vocabOf(t.code)) + ']\n'; });
          (sg.constraints || []).forEach(function (cn) { h += '\u25b8 ' + esc(cn.text) + '\n'; });
          h += '</div>';
        });
      });
    });
    document.getElementById('codesbody').innerHTML = h;
    panel.style.display = 'block';
  }

  function applyParsed(parsed, statusEl) {
    state = deriveDesign(parsed);
    rawGroups = parsed;
    renderForm();
    renderDiagram();
    renderCodesPanel(parsed);
    if (statusEl) {
      var nc = state.cohorts.length, ns = state.shared.length;
      statusEl.textContent = 'Parsed: ' + nc + ' cohorts, ' + ns + ' shared criteria, ' + state.outcomes.length + ' outcomes.';
      statusEl.className = 'status';
    }
  }

  function looksLikeTrinetx(lines) {
    var j = lines.join('\n');
    return /Compare Outcomes Analysis/.test(j) && /Query Criteria for/.test(j);
  }

  /* ---- input handlers ---- */
  window.switchTab = function (name) {
    ['upload', 'paste', 'manual'].forEach(function (t) {
      document.getElementById('tab-' + t).className = t === name ? 'active' : '';
      document.getElementById('pane-' + t).className = 'pane' + (t === name ? ' active' : '');
    });
  };

  async function handleFile(file) {
    var st = document.getElementById('status-upload');
    st.textContent = 'Reading ' + file.name + ' \u2026'; st.className = 'status';
    try {
      var buf = await file.arrayBuffer();
      var lines = await extractDocxLines(buf);
      if (looksLikeTrinetx(lines)) applyParsed(parseTrinetx(lines), st);
      else {
        applyParsed(heuristicParse(lines.join('\n')), st);
        st.textContent += ' (free-text mode \u2014 check the form)';
      }
    } catch (err) {
      st.textContent = 'Could not parse: ' + err.message + ' \u2014 try the Paste text tab instead.';
      st.className = 'status err';
    }
  }
  document.getElementById('file').addEventListener('change', function (e) { if (e.target.files[0]) handleFile(e.target.files[0]); });
  var drop = document.getElementById('drop');
  drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.className = 'drop over'; });
  drop.addEventListener('dragleave', function () { drop.className = 'drop'; });
  drop.addEventListener('drop', function (e) {
    e.preventDefault(); drop.className = 'drop';
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });

  window.parsePasted = function () {
    var txt = document.getElementById('paste').value.trim();
    var st = document.getElementById('status-paste');
    if (!txt) { st.textContent = 'Paste some text first.'; st.className = 'status err'; return; }
    var lines = txt.split('\n').map(function (s) { return s.trim(); }).filter(function (s) { return s; });
    if (looksLikeTrinetx(lines)) applyParsed(parseTrinetx(lines), st);
    else {
      applyParsed(heuristicParse(txt), st);
      st.textContent += ' (free-text mode \u2014 check the form)';
    }
  };

  window.loadBlank = function () {
    state = blankState(); rawGroups = null;
    renderForm(); renderDiagram(); renderCodesPanel(null);
  };

  /* form events (delegation) */
  document.getElementById('form').addEventListener('input', function (e) {
    var p = e.target.getAttribute('data-path');
    if (!p) return;
    if (p === 'matchVars') {
      state.matchVars = e.target.value.split('\n').map(function (s) { return s.trim(); }).filter(function (s) { return s; });
    } else if (/\.primary$/.test(p)) {
      setPath(state, p, e.target.value === 'primary');
    } else if (e.target.type === 'checkbox') setPath(state, p, e.target.checked);
    else setPath(state, p, e.target.value);
    scheduleRender();
  });
  document.getElementById('form').addEventListener('click', function (e) {
    var add = e.target.getAttribute('data-add'), rem = e.target.getAttribute('data-remove');
    if (add) {
      var list = add.split('.').reduce(function (o, k) { return o[k]; }, state);
      if (add === 'outcomes') list.push({ name: '', detail: '', primary: true });
      else if (add === 'subgroups') list.push({ name: '', lineA: '', lineB: '' });
      else list.push({ label: '', detail: '', logic: 'must have' });
      renderForm(); renderDiagram();
    } else if (rem) {
      var parts = rem.split('.'), idx = parseInt(parts.pop(), 10);
      var list2 = parts.reduce(function (o, k) { return o[k]; }, state);
      list2.splice(idx, 1);
      renderForm(); renderDiagram();
    }
  });

  /* ---- export ---- */
  var fontCssPromise = null;
  function getEmbeddedFontCss() {
    if (fontCssPromise) return fontCssPromise;
    fontCssPromise = (async function () {
      try {
        var url = 'https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap';
        var css = await (await fetch(url)).text();
        var urls = [];
        css.replace(/url\((https:[^)]+)\)/g, function (m, u) { urls.push(u); return m; });
        var out = css;
        for (var i = 0; i < urls.length; i++) {
          var b = await (await fetch(urls[i])).blob();
          var b64 = await new Promise(function (res) {
            var r = new FileReader(); r.onload = function () { res(r.result); }; r.readAsDataURL(b);
          });
          out = out.split(urls[i]).join(b64);
        }
        return out;
      } catch (e) { return ''; }
    })();
    return fontCssPromise;
  }

  async function serializedSvg() {
    var svgEl = document.querySelector('#figurewrap svg');
    if (!svgEl) return null;
    var clone = svgEl.cloneNode(true);
    var fontCss = await getEmbeddedFontCss();
    if (fontCss) {
      var style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
      style.textContent = fontCss;
      clone.insertBefore(style, clone.firstChild);
    }
    return new XMLSerializer().serializeToString(clone);
  }

    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function baseName() {

  }

  window.exportSvg = async function () {
    var s = await serializedSvg();

  };
  window.exportPng = async function () {
    var s = await serializedSvg();
    if (!s) return;
    var svgEl = document.querySelector('#figurewrap svg');
    var w = svgEl.viewBox.baseVal.width, h = svgEl.viewBox.baseVal.height;
    var img = new Image();
    img.onload = function () {
      var cv = document.createElement('canvas');
      cv.width = w * 2; cv.height = h * 2;
      var cx = cv.getContext('2d');
      cx.scale(2, 2);
      cx.drawImage(img, 0, 0, w, h);
      cv.toBlob(function (b) { if (b) download(b, baseName() + '.png'); }, 'image/png');
    };
    img.src = URL.createObjectURL(new Blob([s], { type: 'image/svg+xml' }));
  };
  window.exportHtml = async function () {
    var s = await serializedSvg();
    if (!s) return;
    var doc = '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
      '<title>' + esc(state.meta.title || 'Study design') + '</title>\n' +
      '<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">\n' +

      '</head>\n<body>\n' + s + '\n</body>\n</html>';
    download(new Blob([doc], { type: 'text/html' }), baseName() + '.html');
  };

  /* ---- example ---- */
  window.loadExample = function () {
    var parsed = window.__EXAMPLE__;
    applyParsed(parsed, null);
    switchTab('upload');
    document.getElementById('status-upload').textContent = 'Example loaded: cSDH PLT<100k \u2014 standalone MMAE vs medical management.';
  };

  /* init */
  state = blankState();
  renderForm();
  renderDiagram();
})();
