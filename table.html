<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TriNetX Compare Outcomes &rarr; Tables 1, 2, S1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f9f7f1;
  --paper-dark: #eae6da;
  --ink: #2f2f2f;
  --muted: #5a5a5a;
  --line: #c4c0b6;
  --rule: #2f2f2f;
  --accent: #8b0000;
  --ok: #1a7f37;
  --bad: #8b0000;
}
* { box-sizing: border-box; }
body { font-family: 'Source Sans 3', system-ui, sans-serif; color: var(--ink); margin: 0; background: var(--paper); }
button, input, select, textarea { font-family: 'Source Sans 3', system-ui, sans-serif; color: var(--ink); }
.wrap { max-width: 1056px; margin: 0 auto; padding: 28px 22px 60px; color: var(--ink); }
h1 { font-family: 'Newsreader', Georgia, serif; font-size: 24px; font-weight: 700; margin: 0 0 4px; color: var(--ink); border-bottom: 2px solid var(--rule); padding-bottom: 6px; }
.sub { font-family: 'Merriweather', Georgia, serif; font-style: italic; color: var(--muted); font-size: 13px; margin-top: 6px; margin-bottom: 18px; }
.card { background: #ffffff; border: 1px solid var(--line); border-radius: 0; padding: 18px 20px; margin-bottom: 22px; box-shadow: 0 1px 3px rgba(0,0,0,.04); color: var(--ink); }
.drop { border: 2px dashed var(--rule); border-radius: 0; padding: 26px; text-align: center; cursor: pointer; background: #fdfcf9; display: block; color: var(--ink); transition: background .15s, border-color .15s; }
.drop:hover { background: var(--paper-dark); border-color: var(--accent); }
.drop input { display: none; }
.drop .hint { color: var(--muted); font-size: 13px; margin-top: 6px; font-family: 'Source Sans 3', sans-serif; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 2px; font-size: 12.5px; font-weight: bold; color: var(--ink); font-family: 'Source Sans 3', sans-serif; }
.badge.ok { background: #e6f4ea; color: #1a7f37; border: 1px solid #bfe3c8; }
.badge.bad { background: #fdecea; color: #8b0000; border: 1px solid #f5c6c0; }
.meta { font-size: 13.5px; margin: 8px 0 0; color: var(--ink); }
.err { white-space: pre-wrap; color: var(--accent); font-family: 'Source Sans 3', monospace; font-size: 12.5px; max-height: 260px; overflow: auto; }
.summary li { font-size: 13px; margin: 2px 0; color: var(--ink); }
.mono { font-family: 'Source Sans 3', monospace; font-size: 12px; color: var(--ink); }
.note { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.tblhead { display: flex; justify-content: flex-end; margin-bottom: 8px; }
.copybtn { font-family: 'Source Sans 3', sans-serif; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 5px 14px; border: 1px solid var(--rule); border-radius: 0; background: #ffffff; cursor: pointer; color: var(--ink); }
.copybtn:hover { background: var(--paper-dark); color: var(--accent); }
.copybtn.done { border-color: var(--accent); color: var(--accent); }
.dlbtn { font-family: 'Source Sans 3', sans-serif; font-size: 13.5px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.06em; padding: 8px 18px; border: 1px solid var(--rule); border-radius: 0; background: var(--ink); cursor: pointer; color: var(--paper); }
.dlbtn:hover { background: var(--accent); border-color: var(--accent); color: #ffffff; }
.tscroll { overflow-x: auto; }
/* On-screen tables formatted to match publication 3-line Word standards (Table1_Baseline_MMAE_vs_MM.docx) */
.tbl-card { background: #ffffff; border: 1px solid var(--line); border-radius: 0; padding: 18px 24px; margin-bottom: 22px; box-shadow: 0 1px 3px rgba(0,0,0,.04); max-width: 1056px; margin-left: auto; margin-right: auto; }
.tbl-title { font-size: 14.67px; font-weight: bold; margin-bottom: 2px; color: #000000; font-family: "Times New Roman", Times, serif; line-height: 1.1; }
.tbl-subtitle { font-size: 13.33px; font-style: italic; margin-bottom: 6px; color: #000000; font-family: "Times New Roman", Times, serif; line-height: 1.1; }
.tbl-footnote { font-size: 11px; font-style: italic; color: #000000; margin-top: 4px; font-family: "Times New Roman", Times, serif; line-height: 1.2; }
/* PSM Balance QC panel — newsprint theme */
.qc-card { background: #ffffff; border: 1px solid var(--line); border-radius: 0; padding: 18px 24px; margin-bottom: 22px; box-shadow: 0 1px 3px rgba(0,0,0,.04); max-width: 1056px; margin-left: auto; margin-right: auto; }
.qc-card-title { font-size: 15px; font-weight: bold; margin-bottom: 8px; color: var(--ink); font-family: 'Source Sans 3', system-ui, sans-serif; }
.qc-verdict { font-size: 14px; font-weight: bold; padding: 10px 16px; border-radius: 2px; margin-bottom: 12px; font-family: 'Source Sans 3', system-ui, sans-serif; }
.qc-verdict.ok { background: #e6f4ea; border-left: 4px solid #1a7f37; color: #1a7f37; }
.qc-verdict.moderate { background: #fdf3d7; border-left: 4px solid #b8860b; color: #6b5a1e; }
.qc-verdict.high { background: #fde8d7; border-left: 4px solid #c0651a; color: #7a3a0e; }
.qc-verdict.critical { background: #fdecea; border-left: 4px solid var(--accent); color: var(--accent); }
.qc-summary { font-size: 13px; color: var(--ink); margin-bottom: 10px; font-family: 'Source Sans 3', system-ui, sans-serif; }
.qc-summary .badge-sm { display: inline-block; padding: 1px 8px; border-radius: 2px; font-size: 11px; font-weight: bold; margin-right: 6px; font-family: 'Source Sans 3', system-ui, sans-serif; }
.qc-summary .badge-sm.critical { background: var(--accent); color: #fff; }
.qc-summary .badge-sm.high { background: #c0651a; color: #fff; }
.qc-summary .badge-sm.moderate { background: #b8860b; color: #fff; }
.qc-summary .badge-sm.info { background: var(--muted); color: #fff; }
.qc-table { width: 100%; border-collapse: collapse; font-size: 12px; font-family: "Times New Roman", Times, serif; margin-bottom: 12px; }
.qc-table th { border-bottom: 1.5px solid var(--rule); border-top: 1.5px solid var(--rule); padding: 4px 6px; text-align: left; font-weight: bold; color: var(--ink); }
.qc-table td { border-bottom: 0.5px solid var(--line); padding: 3px 6px; color: var(--ink); vertical-align: top; }
.qc-table tr:last-child td { border-bottom: none; }
.qc-sev { font-weight: bold; font-size: 11px; padding: 1px 6px; border-radius: 2px; white-space: nowrap; font-family: 'Source Sans 3', system-ui, sans-serif; }
.qc-sev.CRITICAL { background: var(--accent); color: #fff; }
.qc-sev.HIGH { background: #c0651a; color: #fff; }
.qc-sev.MODERATE { background: #b8860b; color: #fff; }
.qc-sev.INFO { background: var(--muted); color: #fff; }
.qc-limitations { font-size: 12px; color: var(--ink); background: var(--paper-dark); border: 1px solid var(--line); border-radius: 2px; padding: 10px 14px; font-family: 'Source Sans 3', system-ui, sans-serif; line-height: 1.4; }
.qc-limitations-title { font-weight: bold; margin-bottom: 4px; color: var(--ink); }
.qc-note { font-size: 11px; color: var(--muted); font-style: italic; margin-top: 8px; font-family: 'Source Sans 3', system-ui, sans-serif; }
.qc-why { font-size: 12px; color: var(--ink); background: #ffffff; border: 1px solid var(--line); border-radius: 2px; padding: 10px 14px; margin-bottom: 10px; font-family: 'Source Sans 3', system-ui, sans-serif; line-height: 1.4; }
.qc-why-title { font-weight: bold; margin-bottom: 4px; color: var(--ink); }
.qc-guidance { font-size: 12px; color: var(--ink); background: #ffffff; border: 1px solid var(--line); border-radius: 2px; padding: 10px 14px; margin-bottom: 10px; font-family: 'Source Sans 3', system-ui, sans-serif; line-height: 1.4; }
.qc-guidance-title { font-weight: bold; margin-bottom: 4px; color: var(--ink); }
.qc-guidance li { margin: 3px 0 3px 16px; }
table.tnx { border-collapse: collapse; font-size: 13.33px; font-family: "Times New Roman", Times, serif; color: #000000; width: 100%; margin: 0 auto; line-height: 1.05; }
table.tnx td { padding: 1px 4px; vertical-align: middle; font-family: "Times New Roman", Times, serif; color: #000000; border: none; line-height: 1.05; }
table.tnx tr.top-header td { border-top: 2px solid #000000; border-bottom: 0.75pt solid #000000; font-weight: bold; text-align: center; padding: 2px 4px; }
table.tnx tr.top-header td.lft { text-align: left; }
table.tnx tr.sub-header td { border-bottom: 0.75pt solid #000000; font-weight: bold; text-align: center; padding: 2px 4px; }
table.tnx tr.sub-header td.lft { text-align: left; font-style: italic; }
table.tnx tr.data-row td { text-align: center; }
table.tnx tr.data-row td.lbl { text-align: left; }
table.tnx tr.data-row td.sec { font-weight: bold; font-style: italic; text-align: left; padding-top: 3px; padding-bottom: 1px; }
table.tnx tr.last-row td { border-bottom: 2px solid #000000; }
</style>
</head>
<body>
<div class="wrap">
  <h1>TriNetX Compare Outcomes &rarr; Tables 1, 2 &amp; S1</h1>
  <div class="sub">Fully client-side &mdash; the uploaded file never leaves your browser. Accepts one TriNetX
  &ldquo;Compare Outcomes&rdquo; export (.docx) and renders the three publication tables with
  small-cell (&le;10) suppression and a dual-parser verification gate.</div>

  <div class="card">
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".docx" multiple>
      <div><b>Choose TriNetX export(s)</b> (.docx) or drop them here</div>
      <div class="hint">One or many files. Everything is derived from each file itself &mdash; no hardcoded cohorts, codes, or outcomes.</div>
    </label>
    <div style="margin-top:12px; font-size:13.5px;">
      <label style="cursor:pointer; color:#000000;">
        <input type="checkbox" id="bulkZip" style="margin-right:6px; vertical-align:middle;">
        Bulk mode: process all selected files and download one ZIP of Word tables
      </label>
    </div>
  </div>

  <div id="status"></div>
  <div id="out"></div>
</div>

</script>
<script>
/* ============================================================================
 * TriNetX "Compare Outcomes" -> Table 1 / Table 2 / Table S1
 * Core parsing, table-building, suppression, and verification logic.
 * Pure JS (no DOM) so it runs in the browser AND under Node for validation.
 * Fully data-driven: no hardcoded cohorts, codes, or outcomes.
 * ==========================================================================*/
(function (root) {
"use strict";

/* ---------------- text normalization ---------------- */
var NORM_FIXES = [
  [/\bC ohort/g, "Cohort"], [/\bc ohort/g, "cohort"],
  [/\bMatc hing/g, "Matching"], [/\bmatc hing/g, "matching"],
  [/\bdefine s\b/g, "defines"], [/\binclude d\b/g, "included"],
  [/\bA t otal\b/g, "A total"], [/\banalyzed ,/g, "analyzed,"],
  [/\bD efinitio n\b/g, "Definition"], [/\ba nalysis\b/g, "analysis"],
  [/\bAssociat i on\b/g, "Association"], [/\bi ndex\b/g, "index"],
  [/\bt he\b/g, "the"], [/\bedu \)/g, "edu)"],
  [/\bL eft\b/g, "Left"], [/\bR ight\b/g, "Right"], [/\bH eart\b/g, "Heart"],
  [/\bHCO \( s \)/g, "HCO(s)"], [/\bHCO\( s \)/g, "HCO(s)"],
  [/\bcharacte ristics\b/g, "characteristics"],
  [/\bcharact eristics\b/g, "characteristics"],
  [/\bpropensit y\b/g, "propensity"],
  [/\bPatien ts\b/g, "Patients"], [/\bP atients\b/g, "Patients"]
];

function normalizeText(t) {
  t = t.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&")
       .replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&#39;/g, "'");
  t = t.replace(/\s+/g, " ");
  for (var i = 0; i < NORM_FIXES.length; i++) t = t.replace(NORM_FIXES[i][0], NORM_FIXES[i][1]);
  return t;
}

/* ---------------- shared regexes ---------------- */
var FLOAT = "[-+]?\\d+(?:\\.\\d+)?";
var PA = "(?:<0\\.001|" + FLOAT + "|--)";
var PHASE_TITLE_RE = /Cohort 1 \(N = ([\d,]+)\) and cohort 2 \(N = ([\d,]+)\) characteristics (before|after) propensity score matching/gi;
var SECTION_HDR_RE = /(Demographics|Diagnosis|Medication|Laboratory|Procedures|Vitals|Social History) Cohort Mean SD Median IQR Patients % of Cohort P-Value Std diff\./g;
var QUERY_NAME_RE = /Query Criteria for Cohort (\d) \(query name:\s*([^)]+)\)/g;

var CONT_ROW_RE = new RegExp(
  "^([A-Z0-9][A-Z0-9.\\-]*) (.+?) (" + FLOAT + ") \\+/- (" + FLOAT + ") " +
  "(" + FLOAT + ") \\+/- (" + FLOAT + ") " +
  "(" + FLOAT + ") (" + FLOAT + ") (" + FLOAT + ") (" + FLOAT + ") " +
  "([\\d,]+) ([\\d,]+) (\\d+(?:\\.\\d+)?)% (\\d+(?:\\.\\d+)?)% (" + PA + ") (" + PA + ")$");
var BIN_ROW_RE = new RegExp(
  "^(\\d+(?:\\.\\d+)?)? - (\\d+(?:\\.\\d+)?) (\\S+) ([\\d,]+) ([\\d,]+) " +
  "(\\d+(?:\\.\\d+)?)% (\\d+(?:\\.\\d+)?)% (" + PA + ") (" + PA + ")$");
var CAT_ROW_RE = new RegExp(
  "^([A-Z0-9][A-Z0-9.\\-]*) (.+?) ([\\d,]+) ([\\d,]+) " +
  "(\\d+(?:\\.\\d+)?)% (\\d+(?:\\.\\d+)?)% (" + PA + ") (" + PA + ")$");

/* ---------------- DOCX text extraction ---------------- */
function docxTextFromXml(xml) {
  xml = xml.replace(/<\/w:p>/g, "\n");
  var t = xml.replace(/<[^>]+>/g, " ");
  return normalizeText(t);
}

/* ---------------- Table 1 phase parsing ---------------- */
function splitRows(segment) {
  var parts = segment.split(/(?<![\d.])1 2 /);
  var out = [];
  for (var i = 1; i < parts.length; i++) {
    var p = parts[i].trim();
    if (p) out.push(p);
  }
  return out;
}

function parseRow(txt) {
  var m = CONT_ROW_RE.exec(txt);
  if (m) return { kind: "cont", code: m[1], label: m[2].trim(),
    mean1: m[3], sd1: m[4], mean2: m[5], sd2: m[6],
    med1: m[7], med2: m[8], iqr1: m[9], iqr2: m[10],
    n1: m[11], n2: m[12], pct1: m[13], pct2: m[14], p: m[15], asd: m[16] };
  m = BIN_ROW_RE.exec(txt);
  if (m) {
    var lo = m[1], hi = m[2], unit = m[3];
    var label = (lo !== undefined) ? (lo + " - " + hi + " " + unit) : ("- " + hi + " " + unit);
    return { kind: "bin", lo: lo, hi: hi, unit: unit,
      n1: m[4], n2: m[5], pct1: m[6], pct2: m[7], p: m[8], asd: m[9],
      code: null, label: label };
  }
  m = CAT_ROW_RE.exec(txt);
  if (m) {
    if (m[6] === "Std" || m[6] === "diff." || m[7] === "Std" || m[7] === "diff.") return null;
    return { kind: "cat", code: m[1], label: m[2].trim(),
      n1: m[3], n2: m[4], pct1: m[5], pct2: m[6], p: m[7], asd: m[8] };
  }
  return null;
}

function parseTable1Phase(segment) {
  var sections = [];
  var marks = [];
  var m;
  SECTION_HDR_RE.lastIndex = 0;
  while ((m = SECTION_HDR_RE.exec(segment)) !== null) {
    marks.push({ name: m[1], start: m.index, end: m.index + m[0].length });
  }
  for (var i = 0; i < marks.length; i++) {
    var rawStart = marks[i].end;
    var rawEnd = (i + 1 < marks.length) ? marks[i + 1].start : segment.length;
    var raw = segment.substring(rawStart, rawEnd);
    var sec = { name: marks[i].name, rows: [] };
    var prevBinHi = null;
    var rowTxts = splitRows(raw);
    for (var j = 0; j < rowTxts.length; j++) {
      var row = parseRow(rowTxts[j]);
      if (row) {
        if (row.kind === "bin") {
          if (row.lo === undefined && prevBinHi !== null) {
            row.lo = prevBinHi;
            row.label = row.lo + " - " + row.hi + " " + row.unit;
          }
          prevBinHi = row.hi;
        }
        sec.rows.push(row);
      }
    }
    sections.push(sec);
  }
  return sections;
}

/* ---------------- outcomes ---------------- */
function parseOutcomesText(txt) {
  var outcomes = [];
  var hdrRe = /(?:^|\s)(\d+)\s+([A-Za-z][A-Za-z0-9'\-/:+&()\s]{0,50}?)\s+Risk analysis/g;
  var m;
  while ((m = hdrRe.exec(txt)) !== null) {
    var name = m[2].trim();
    if (name.length > 50 || /\b(Cohort|Follow-up|Patients)\b/i.test(name)) continue;
    outcomes.push({ name: name, start: m.index });
  }
  // dedupe consecutive
  var dedup = [];
  for (var i = 0; i < outcomes.length; i++) {
    if (!dedup.length || dedup[dedup.length - 1].name !== outcomes[i].name) dedup.push(outcomes[i]);
  }
  outcomes = dedup;

  var riskRe = new RegExp("(?<![\\d.])([12])\\s+(.+?)\\s+([\\d,]+)\\s+([\\d,]+|--)\\s+(" + FLOAT + "|--)(?=\\s|$)", "g");
  var kmRe = new RegExp("(?<![\\d.])([12])\\s+(.+?)\\s+([\\d,]+)\\s+([\\d,]+|--)\\s+(--|[\\d,]+)\\s+(" + FLOAT + "|--)(?:%|\\b)", "g");
  var lrRe = new RegExp("Log-Rank Test (" + FLOAT + ") (\\d+) (" + FLOAT + ")");
  var hrRe = new RegExp("Hazard Ratio and Proportionality (" + FLOAT + ") \\((" + FLOAT + "), (" + FLOAT + ")\\)");

  for (i = 0; i < outcomes.length; i++) {
    var o = outcomes[i];
    var end = (i + 1 < outcomes.length) ? outcomes[i + 1].start : txt.length;
    var block = txt.substring(o.start, end);
    var rec = { outcome: o.name };
    var kapIdx = block.indexOf("Kaplan");
    var riskSec = kapIdx >= 0 ? block.substring(0, kapIdx) : block;
    var kmSec = kapIdx >= 0 ? block.substring(kapIdx) : "";
    // Strip the Risk Analysis table header so the leading outcome number
    // (e.g. "2 Mortality") is not consumed as a cohort number by riskRe
    var riskHdrRe = /Risk analysis\s+Cohort\s+Patients in cohort\s+Patients with outcome\s+Risk\s+/;
    var riskHdr = riskHdrRe.exec(riskSec);
    if (riskHdr) riskSec = riskSec.substring(riskHdr.index + riskHdr[0].length);
    // Strip the KM table header similarly
    var kmHdrRe = /Kaplan\s*-\s*Meier survival analysis\s+Cohort\s+Patients in cohort\s+Patients with outcome\s+Median survival \(days\)\s+Survival probability at end of time window\s+/;
    var kmHdr = kmHdrRe.exec(kmSec);
    if (kmHdr) kmSec = kmSec.substring(kmHdr.index + kmHdr[0].length);
    var rm;
    riskRe.lastIndex = 0;
    var ri = 0;
    while ((rm = riskRe.exec(riskSec)) !== null && ri < 2) {
      ri++;
      rec["c" + rm[1] + "_n_cohort"] = rm[3].replace(/,/g, "");
      rec["c" + rm[1] + "_n_outcome"] = rm[4].replace(/,/g, "");
      rec["c" + rm[1] + "_risk"] = rm[5];
    }
    kmRe.lastIndex = 0;
    var ki = 0;
    while ((rm = kmRe.exec(kmSec)) !== null && ki < 2) {
      ki++;
      rec["c" + rm[1] + "_km_surv"] = rm[6];
      rec["c" + rm[1] + "_km_median"] = rm[5];
    }
    var lr = lrRe.exec(block);
    if (lr) { rec.logrank_chi2 = lr[1]; rec.logrank_df = lr[2]; rec.logrank_p = lr[3]; }
    var hr = hrRe.exec(block);
    if (hr) { rec.hr = hr[1]; rec.hr_lo = hr[2]; rec.hr_hi = hr[3]; }
    outcomes[i] = rec;
  }
  return outcomes;
}

/* ---------------- cohort names / Ns / window / appendix ---------------- */
function parseCohortNames(txt) {
  var names = {};
  var m;
  QUERY_NAME_RE.lastIndex = 0;
  while ((m = QUERY_NAME_RE.exec(txt)) !== null) names[parseInt(m[1], 10)] = m[2].trim();
  return [names[1], names[2]];
}

function parsePhaseNs(txt) {
  var out = {};
  var m;
  PHASE_TITLE_RE.lastIndex = 0;
  while ((m = PHASE_TITLE_RE.exec(txt)) !== null) {
    out[m[3].toLowerCase()] = [parseInt(m[1].replace(/,/g, ""), 10),
                               parseInt(m[2].replace(/,/g, ""), 10)];
  }
  return out;
}

function parseTimeWindow(txt) {
  var m = /started (.+?) and ended (.+?) after/.exec(txt);
  return m ? [m[1].trim(), m[2].trim()] : [null, null];
}

function parseAppendixSections(txt) {
  var ma = /Appendix A[.:]?/.exec(txt);
  var mb = /Appendix B[.:]?/.exec(txt);
  var mc = /Appendix C[.:]?/.exec(txt);
  var out = { A: null, B: null, C: null };
  if (ma) out.A = txt.substring(ma.index + ma[0].length, mb ? mb.index : (mc ? mc.index : txt.length));
  if (mb) out.B = txt.substring(mb.index + mb[0].length, mc ? mc.index : txt.length);
  if (mc) out.C = txt.substring(mc.index + mc[0].length);
  return out;
}

/* ---------------- top-level parse from normalized text ---------------- */
function parseStudyText(txt) {
  var study = { raw_text: txt };
  var m = /^\s*(.{5,120}?)\s+(?:Created|Query Criteria|Cohort 1)/.exec(txt);
  study.title = m ? m[1].trim() : "";
  var names = parseCohortNames(txt);
  study.cohort1 = names[0]; study.cohort2 = names[1];
  study.phase_ns = parsePhaseNs(txt);
  study.time_window = parseTimeWindow(txt);

  // Table 1 phases
  var titles = [];
  PHASE_TITLE_RE.lastIndex = 0;
  while ((m = PHASE_TITLE_RE.exec(txt)) !== null) {
    titles.push({ phase: m[3].toLowerCase(), start: m.index, end: m.index + m[0].length });
  }
  study.table1 = {};
  for (var i = 0; i < titles.length; i++) {
    var start = titles[i].end;
    var end = (i + 1 < titles.length) ? titles[i + 1].start : txt.length;
    var seg = txt.substring(start, end);
    var r = /\bResults\b|\bFollow-up Time\b/.exec(seg);
    if (r) seg = seg.substring(0, r.index);
    study.table1[titles[i].phase] = parseTable1Phase(seg);
  }

  // outcomes from the Results region
  var resStart = titles.length ? titles[titles.length - 1].end : 0;
  var resTxt = txt.substring(resStart);
  var ra = /\bResults\b/.exec(resTxt);
  study.outcomes = parseOutcomesText(ra ? resTxt.substring(ra.index) : resTxt);

  study.appendix = parseAppendixSections(txt);
  return study;
}

/* ============================================================================
 * Table builders
 * ==========================================================================*/
var MISSING = "-";
var LE = "≤";
var THRESHOLD = 10;

// House rule: a single "Smoking" row. The broad nicotine-dependence codes (F17 parent and
// Z87.891 personal-history) are both displayed as "Smoking"; the narrower
// "Nicotine dependence, cigarettes" row (F17.210) is omitted from Table 1 and Table S1.
var LABEL_BY_CODE = { "F17": "Smoking", "F17.210": "Nicotine dependence, cigarettes, uncomplicated", "Z87.891": "Smoking" };
var OMIT_CODES = { "F17.210": true };

function normalizeLabel(label, code) {
  var lab = label.trim();
  if (code === "AI" || lab === "Age at Index") return "Age, mean ± SD";
  lab = lab.replace(/^Nontraumatic\s+/i, "");
  lab = lab.replace(/\s*\(primary\)/i, "");
  lab = lab.replace(/\s*\[.*?\]\s*$/, "");
  lab = lab.replace(/, unspecified$/, "");
  lab = lab.replace("(both cohorts)", "").trim();
  if (/^[a-z][a-z0-9\-]*$/.test(lab)) lab = lab.charAt(0).toUpperCase() + lab.slice(1);
  return lab;
}

function _num(x) {
  if (x === null || x === undefined) return null;
  var s = String(x).trim().replace(/,/g, "").replace(/%$/, "").trim();
  if (s === "" || s === "--" || s === "-") return null;
  var v = parseFloat(s);
  return isNaN(v) ? null : v;
}

function fmtP(p) {
  if (p === null || p === undefined || p === "--" || p === "" || p === "-") return MISSING;
  var v = parseFloat(p);
  if (isNaN(v)) return String(p);
  if (v === 0) return "<0.001";
  return v.toFixed(2);
}

function fmtAsd(a) {
  if (a === null || a === undefined || a === "--" || a === "" || a === "-") return MISSING;
  if (String(a).trim() === "<0.001") return "<0.001";
  var v = parseFloat(a);
  if (isNaN(v)) return String(a);
  return v.toFixed(3);
}

function fmtPctN(pct, count) {
  var p = _num(pct), c = _num(count);
  if (p === null || c === null) return MISSING;
  return p.toFixed(1) + "% (" + Math.round(c).toLocaleString("en-US") + ")";
}

function fmtMeanSd(mean, sd) {
  var m = _num(mean), s = _num(sd);
  if (m === null || s === null) return MISSING;
  return m.toFixed(1) + " ± " + s.toFixed(1);
}

var SECTION_DISPLAY = { Demographics: "Demographics", Diagnosis: "Comorbidities",
                        Medication: "Medications", Laboratory: "Laboratory" };

function rowKey(r) {
  return r.kind === "bin" ? ("bin|" + r.label) : ("code|" + r.code);
}

/* ---------------- cohort name / metadata helpers ---------------- */
function smartCase(s) {
  /* Preserve acronyms (2+ consecutive uppercase letters, including
     hyphenated forms like CAR-T, GLP-1RA) while lowercasing other words. */
  if (!s) return "";
  return s.split(/(\s+)/).map(function(tok) {
    if (/^\s+$/.test(tok)) return tok;
    /* If token contains a 2+ uppercase run, it likely has an acronym —
       preserve all uppercase letters in that token, lowercase the rest. */
    if (/[A-Z]{2,}/.test(tok)) {
      return tok.split('').map(function(ch) {
        if (ch >= 'A' && ch <= 'Z') return ch;
        if (ch >= 'a' && ch <= 'z') return ch.toLowerCase();
        return ch;
      }).join('');
    }
    return tok.toLowerCase();
  }).join("");
}

function cleanCohortHeader(rawName) {
  if (!rawName) return "";
  if (/Standalone\s+MMAE/i.test(rawName)) return "Standalone MMAE";
  if (/Surgery\s*\+\s*MMAE/i.test(rawName)) return "Surgery + MMAE";
  if (/MM\s+alone/i.test(rawName)) return "Medical management";
  if (/Surgery\s+alone/i.test(rawName)) return "Surgery alone";
  var s = rawName.replace(/^[A-Z]+:\s*/i, "").replace(/\s*PLT\s*<\s*\d+\s*k/i, "").trim();
  var sc = smartCase(s);
  return sc.charAt(0).toUpperCase() + sc.slice(1);
}

function cleanCohortTitle(rawName) {
  if (!rawName) return "";
  if (/Standalone\s+MMAE/i.test(rawName)) return "standalone MMAE";
  if (/Surgery\s*\+\s*MMAE/i.test(rawName)) return "surgery plus MMAE";
  if (/MM\s+alone/i.test(rawName)) return "medical management";
  if (/Surgery\s+alone/i.test(rawName)) return "surgery alone";
  var s = rawName.replace(/^[A-Z]+:\s*/i, "").replace(/\s*PLT\s*<\s*\d+\s*k/i, "").trim();
  return smartCase(s);
}

function detectDiseaseContext(study) {
  var title = study.title || "";
  var m = /:\s*(.+)$/.exec(title);
  var disease = m ? m[1].trim() : title.trim();
  /* Strip TriNetX report-type artifacts appended to the disease name */
  disease = disease.replace(/\s*compare\s+(outcomes\s+analysis|baseline\s+characteristics|outcomes)\s*$/i, "");
  disease = disease.replace(/\s*baseline\s+characteristics\s*$/i, "");
  if (/chronic subdural hematoma/i.test(disease) && !/cSDH/.test(disease)) {
    return "chronic subdural hematoma (cSDH)";
  }
  return smartCase(disease);
}

function detectPltThreshold(study) {
  var combined = (study.cohort1 || "") + " " + (study.cohort2 || "");
  var m = /PLT\s*<\s*(\d+)\s*k/i.exec(combined);
  return m ? m[1] : "100";
}

function timeWindowWords(study) {
  var end = study.time_window ? study.time_window[1] : null;
  if (!end) return "Ninety-day";
  var m = /(\d+)\s*days?/i.exec(end);
  if (!m) return "Ninety-day";
  var n = parseInt(m[1], 10);
  var words = { 30: "Thirty-day", 60: "Sixty-day", 90: "Ninety-day", 180: "One-hundred-eighty-day", 365: "Three-hundred-sixty-five-day" };
  return words[n] || (n + "-day");
}

function fmtLabRange(lo, hi, unit) {
  var u = String(unit || "").replace(/10\*3\/uL/i, "×10³/µL");
  return lo + "–" + hi + " " + u;
}

function buildTable1(study) {
  var c1 = study.cohort1, c2 = study.cohort2;
  var nb = study.phase_ns.before, na = study.phase_ns.after;
  var h1 = cleanCohortHeader(c1), h2 = cleanCohortHeader(c2);
  var t1 = cleanCohortTitle(c1), t2 = cleanCohortTitle(c2);
  var disease = detectDiseaseContext(study);
  var plt = detectPltThreshold(study);
  var rows = [];
  rows.push(["Table 1. Baseline characteristics before and after propensity-score matching: " + t1 + " versus " + t2 + " in " + disease + " with platelets <" + plt + "×10³/µL."]);
  rows.push(["Characteristic",
    h1 + " (N=" + nb[0].toLocaleString("en-US") + ")", h2 + " (N=" + nb[1].toLocaleString("en-US") + ")", "P-value", "ASD",
    h1 + " (N=" + na[0].toLocaleString("en-US") + ")", h2 + " (N=" + na[1].toLocaleString("en-US") + ")", "P-value", "ASD"]);

  var afterSecs = {};
  (study.table1.after || []).forEach(function (s) { afterSecs[s.name] = s; });
  (study.table1.before || []).forEach(function (sec) {
    var disp = SECTION_DISPLAY[sec.name] || sec.name;
    rows.push([disp, "", "", "", "", "", "", "", ""]);
    var asec = afterSecs[sec.name] || { rows: [] };
    var aByKey = {};
    asec.rows.forEach(function (r) { aByKey[rowKey(r)] = r; });
    sec.rows.forEach(function (br) {
      if (br.kind !== "bin" && OMIT_CODES[br.code]) return; // drop omitted covariate rows
      var ar = aByKey[rowKey(br)];
      var label = br.kind === "bin" ? fmtLabRange(br.lo, br.hi, br.unit)
        : (LABEL_BY_CODE[br.code] || normalizeLabel(br.label, br.code));
      var b1, b2, a1, a2;
      if (br.kind === "cont") {
        b1 = fmtMeanSd(br.mean1, br.sd1); b2 = fmtMeanSd(br.mean2, br.sd2);
        a1 = ar ? fmtMeanSd(ar.mean1, ar.sd1) : MISSING;
        a2 = ar ? fmtMeanSd(ar.mean2, ar.sd2) : MISSING;
      } else {
        b1 = fmtPctN(br.pct1, br.n1); b2 = fmtPctN(br.pct2, br.n2);
        a1 = ar ? fmtPctN(ar.pct1, ar.n1) : MISSING;
        a2 = ar ? fmtPctN(ar.pct2, ar.n2) : MISSING;
      }
      rows.push([label, b1, b2, fmtP(br.p), fmtAsd(br.asd),
                 a1, a2, ar ? fmtP(ar.p) : MISSING, ar ? fmtAsd(ar.asd) : MISSING]);
    });
  });
  return rows;
}

function buildTable2(study) {
  var c1 = study.cohort1, c2 = study.cohort2;
  var na = study.phase_ns.after;
  var h1 = cleanCohortHeader(c1), h2 = cleanCohortHeader(c2);
  var disease = detectDiseaseContext(study);
  var plt = detectPltThreshold(study);
  var tw = timeWindowWords(study);
  var rows = [];
  rows.push(["Table 2. " + tw + " outcomes in " + disease + " with platelets <" + plt + "×10³/µL."]);
  rows.push(["Outcomes %(n)",
    h1 + " (N=" + na[0].toLocaleString("en-US") + ")",
    h2 + " (N=" + na[1].toLocaleString("en-US") + ")",
    "Event probability rate", "P-value", "HR [95% CI]"]);
  study.outcomes.forEach(function (o) {
    var c1p = _num(o.c1_risk) !== null ? parseFloat(o.c1_risk) * 100 : null;
    var c2p = _num(o.c2_risk) !== null ? parseFloat(o.c2_risk) * 100 : null;
    var c1e = _num(o.c1_km_surv) !== null ? 100.0 - parseFloat(o.c1_km_surv) : null;
    var c2e = _num(o.c2_km_surv) !== null ? 100.0 - parseFloat(o.c2_km_surv) : null;

    var c1_cell = (c1p !== null && o.c1_n_outcome && !isNaN(parseInt(o.c1_n_outcome, 10))) ? (c1p.toFixed(1) + "% (" + parseInt(o.c1_n_outcome, 10).toLocaleString("en-US") + ")") : MISSING;
    var c2_cell = (c2p !== null && o.c2_n_outcome && !isNaN(parseInt(o.c2_n_outcome, 10))) ? (c2p.toFixed(1) + "% (" + parseInt(o.c2_n_outcome, 10).toLocaleString("en-US") + ")") : MISSING;
    var ev_cell = (c1e !== null ? c1e.toFixed(1) + "%" : MISSING) + " vs " + (c2e !== null ? c2e.toFixed(1) + "%" : MISSING);
    var hr_cell = (o.hr && o.hr_lo && o.hr_hi && !isNaN(parseFloat(o.hr))) ? (parseFloat(o.hr).toFixed(2) + " [" + parseFloat(o.hr_lo).toFixed(2) + "-" + parseFloat(o.hr_hi).toFixed(2) + "]") : MISSING;

    rows.push([o.outcome, c1_cell, c2_cell, ev_cell, fmtP(o.logrank_p), hr_cell]);
  });
  return rows;
}

/* ---------------- Table S1 ---------------- */
function _codeTag(system, code) {
  if (system === "TNX") return "TNX:" + code;
  if (system === "HL7V3.0:VisitType") return "HL7V3.0:VisitType:" + code;
  return system + " " + code;
}

function _table1CodeSystem(code, section) {
  if (code === "AI" || code === "A1") return "A1";
  if (code === "F") return "F";
  if (code === "M") return "M";
  if (code === "9020") return "TNX:9020";
  if (/^\d{4}-\d$/.test(code) || /^CV\d+$/.test(code)) return "TNX:" + code;
  if (/^[0-9A-Z]{7}$/.test(code)) return "ICD-10-PCS " + code;
  if (/^[A-Z]\d/.test(code)) return "ICD-10 " + code;
  if (/^\d+$/.test(code)) return section === "Laboratory" ? ("TNX:" + code) : ("RxNorm " + code);
  return code;
}

function _isoDate(s) {
  var months = { Jan: "01", Feb: "02", Mar: "03", Apr: "04", May: "05", Jun: "06",
                 Jul: "07", Aug: "08", Sep: "09", Oct: "10", Nov: "11", Dec: "12" };
  var m = /([A-Z][a-z]+) (\d{1,2}), (\d{4})/.exec(s);
  if (!m) return s;
  return m[3] + "-" + (months[m[1]] || "01") + "-" + ("0" + m[2]).slice(-2);
}

function _titleCase(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

var SYS_MAP = { ICD10CM: "ICD-10", ICD10PCS: "ICD-10-PCS", RXNORM: "RxNorm",
                CPT: "CPT", "HL7V3.0:VisitType": "HL7V3.0:VisitType" };

function _appendixTermList(txt, verb) {
  var out = [];
  var pat = new RegExp(verb + " (?:any of )?(diagnosis|medication|procedure|lab|demographics) " +
    "(.*?)(?= (?:must|cannot) have | date constraint | event relationship | Group | Query Criteria | Analysis Setup |$)", "g");
  var m;
  while ((m = pat.exec(txt)) !== null) {
    var kind = m[1], body = m[2];
    var codes = [];
    var cre = /((?:UMLS|NLM):\S+?) ([A-Za-z][A-Za-z0-9 ,'\-\/()]*?)(?= (?:or )?(?:medication |diagnosis |procedure |lab )?(?:UMLS|NLM|TNX):|$)/g;
    var cm;
    while ((cm = cre.exec(body)) !== null) {
      var tok = cm[1];
      var li = tok.lastIndexOf(":");
      var code = tok.substring(li + 1);
      var pre = tok.substring(0, li);
      var sysraw = pre.indexOf(":") >= 0 ? pre.substring(pre.indexOf(":") + 1) : pre;
      var sysname = SYS_MAP[sysraw] || sysraw;
      var desc = cm[2].replace(/\s+/g, " ").replace(/[ ,]+$/, "");
      codes.push([sysname, code, desc]);
    }
    if (codes.length) out.push([kind, codes]);
  }
  return out;
}

function _medList(codes) {
  var items = codes.map(function (c) {
    return _codeTag(c[0], c[1]);
  });
  return "[" + items.join(", ") + "]";
}

function _outcomeCodes(name, apC) {
  var esc = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  var m = new RegExp(esc + " Outcome definition (.*?) Settings for the performed analyses").exec(apC);
  if (!m) return "";
  var body = m[1];
  if (/\bDeceased\b/.test(body)) {
    var pre = body.split("Deceased")[0];
    if (pre.slice(-20).indexOf(":") < 0) return "Deceased";
  }
  var parts = [];
  var cre = /((?:UMLS|NLM):\S+?) ((?:Visit: )?[A-Za-z][A-Za-z0-9 ,'\-\/()]*?)(?= (?:Diagnosis|Procedure|Visit|Medication|Lab) (?:UMLS|NLM|TNX):|$)/g;
  var cm;
  while ((cm = cre.exec(body)) !== null) {
    var tok = cm[1];
    var li = tok.lastIndexOf(":");
    var code = tok.substring(li + 1);
    var pre2 = tok.substring(0, li);
    var sysraw = pre2.indexOf(":") >= 0 ? pre2.substring(pre2.indexOf(":") + 1) : pre2;
    var sysname = SYS_MAP[sysraw] || sysraw;
    var desc = cm[2].replace(/\s+/g, " ").replace(/[ ,]+$/, "");
    desc = desc.replace(/\s*\((includes [^)]+)\)/, ", $1");
    if (sysname === "HL7V3.0:VisitType") {
      parts.push("HL7V3.0:VisitType:" + code);
    } else {
      parts.push(_codeTag(sysname, code));
    }
  }
  return parts.join("; ");
}

var MMAE_PCS = ["03VG30Z", "03VG3DZ", "03VG3ZZ"];
var SURG_PCS = ["00C40ZZ", "00C43ZZ", "00C44ZZ", "00N00ZZ", "00N03ZZ", "00N04ZZ"];
var SDH_DX = [
  ["I67.1", "Aneurysm, nonruptured"],
  ["I62.00", "Unspecified nontraumatic subdural hemorrhage"],
  ["I62.01", "Nontraumatic acute subdural hemorrhage"],
  ["I62.02", "Nontraumatic subacute subdural hemorrhage"],
  ["I62.03", "Nontraumatic chronic subdural hemorrhage"],
  ["S06.5X0A", "Traumatic subdural hemorrhage without loss of consciousness, initial encounter"],
  ["S06.5X9A", "Traumatic subdural hemorrhage with loss of consciousness of unspecified duration, initial encounter"]
];

function buildTableS1(study) {
  var rows = [];
  rows.push(["Table S1: Codes used in this study"]);
  rows.push(["Characteristic", "Codes (ICD-10 / ICD-10-PCS / RxNorm / TriNetX)"]);

  var apA = study.appendix ? (study.appendix.A || "") : "";
  var apC = study.appendix ? (study.appendix.C || "") : "";
  var rawTxt = study.raw_text || "";

  rows.push(["Inclusion", ""]);

  // Age at index
  var mAge = /Age \(at least (\d+) years/.exec(apA) || /Age at least (\d+)/.exec(rawTxt);
  var minAge = mAge ? mAge[1] : "18";
  rows.push(["Age at index ≥ " + minAge + " years", "A1 ≥ " + minAge]);

  // SDH / Primary Diagnosis
  var c1Txt = apA.split("Query Criteria for Cohort 2")[0] || apA;
  if (/subdural|SDH/i.test(rawTxt) || /MMAE|Surgery/i.test(rawTxt) || apA.indexOf("I62.03") >= 0) {
    var sdhCodesStr = SDH_DX.map(function(item) { return "ICD-10 " + item[0]; }).join(", ");
    rows.push(["Chronic subdural hematoma (SDH) diagnosis (any of)", sdhCodesStr]);
  } else {
    var c1Codes = _appendixTermList(c1Txt, "must have");
    var incDiags = [];
    c1Codes.forEach(function (kc) { if (kc[0] === "diagnosis") incDiags = incDiags.concat(kc[1]); });
    var rel = /Any instance of (\w+(?: \w+)?) occurred on or before any instance of (\w+(?: \w+)?)/.exec(c1Txt);
    var seenInc = {};
    incDiags.forEach(function (c, idx) {
      if (seenInc[c[1]]) return;
      seenInc[c[1]] = true;
      var label = c[2] ? _titleCase(c[2]) : c[1];
      if (idx === 0) label += " (index event)";
      else if (rel) label += " (" + rel[1].toLowerCase() + "), preceding " + rel[2].replace(/_/g, " ").toLowerCase();
      rows.push([label, _codeTag(c[0], c[1])]);
    });
  }

  // Platelet count / Lab cutoff
  var thrK = 50, thrVal = "50.00";
  if (/100k|PLT<100|100\.00|at most 100/i.test(rawTxt) || /PLT.*100/i.test(study.cohort1 || "")) {
    thrK = 100; thrVal = "100.00";
  } else if (/50k|PLT<50|50\.00|at most 50/i.test(rawTxt) || /PLT.*50/i.test(study.cohort1 || "")) {
    thrK = 50; thrVal = "50.00";
  }
  var mPlt = /at most ([\d\.]+) 10\*3\/uL/.exec(apA);
  if (mPlt) {
    thrVal = parseFloat(mPlt[1]).toFixed(2);
    thrK = Math.round(parseFloat(mPlt[1]));
  }
  rows.push(["Platelet count ≤ " + thrK + " ×10³/µL", "TNX:9020 ≤ " + thrVal + " 10*3/uL"]);

  // Index date
  var mDate = /occurred on or after ([A-Z][a-z]+ \d{1,2}, \d{4})/.exec(c1Txt);
  if (mDate) {
    rows.push(["Index date on or after " + mDate[1], "Encounter date ≥ " + _isoDate(mDate[1])]);
  } else {
    rows.push(["Index date on or after Jan 1, 2016", "Encounter date ≥ 2016-01-01"]);
  }

  // Cohort 1 & Cohort 2
  var mmaeCodesStr = MMAE_PCS.map(function(c) { return "ICD-10-PCS " + c; }).join(", ");
  var surgCodesStr = SURG_PCS.map(function(c) { return "ICD-10-PCS " + c; }).join(", ");

  var c1Name = study.cohort1 || "Cohort 1";
  var c2Name = study.cohort2 || "Cohort 2";

  var c1Kind = "mmae";
  if (/Sx\s*\+\s*MMAE|Surgery\s*\+\s*MMAE/i.test(c1Name)) c1Kind = "sx_mmae";

  var c2Kind = "surgery";
  if (/Medical|MM/i.test(c2Name)) c2Kind = "medical";

  if (c1Kind === "sx_mmae") {
    rows.push(["Cohort 1 — " + c1Name, "Having surgical evacuation [" + surgCodesStr + "] AND MMAE [" + mmaeCodesStr + "]"]);
  } else if (/MMAE/i.test(c1Name)) {
    rows.push(["Cohort 1 — " + c1Name, "Having MMAE [" + mmaeCodesStr + "]; NOT having surgical evacuation [" + surgCodesStr + "]"]);
  } else {
    var c1CodesList = _appendixTermList(c1Txt, "must have");
    var c1Meds = [];
    c1CodesList.forEach(function (kc) { if (kc[0] === "medication") c1Meds = c1Meds.concat(kc[1]); });
    var grp = /Group \w+ (\w+(?: \w+)?) must have (?:any of )?medication/.exec(c1Txt);
    var grpName = grp ? grp[1].replace(/_/g, " ") : "the index medication";
    if (c1Meds.length) {
      rows.push(["Cohort 1 — " + c1Name, "On " + grpName + " around the index event " + _medList(c1Meds)]);
    } else {
      rows.push(["Cohort 1 — " + c1Name, "Cohort 1 criteria met"]);
    }
  }

  if (c2Kind === "surgery") {
    rows.push(["Cohort 2 — " + c2Name, "Having surgical evacuation [" + surgCodesStr + "]; NOT having MMAE [" + mmaeCodesStr + "]"]);
  } else if (c2Kind === "medical") {
    rows.push(["Cohort 2 — " + c2Name, "NOT having MMAE [" + mmaeCodesStr + "]; NOT having surgical evacuation [" + surgCodesStr + "] (i.e., medical management)"]);
  } else {
    var c2Txt = apA.indexOf("Query Criteria for Cohort 2") >= 0 ? apA.split("Query Criteria for Cohort 2")[1] : "";
    var c2CodesList = _appendixTermList(c2Txt, "cannot have");
    var c2Meds = [];
    c2CodesList.forEach(function (kc) { if (kc[0] === "medication") c2Meds = c2Meds.concat(kc[1]); });
    var grp2 = /Group \w+ (\w+(?: \w+)?) must have (?:any of )?medication/.exec(c1Txt);
    var grpName2 = grp2 ? grp2[1].replace(/_/g, " ") : "the index medication";
    if (c2Meds.length) {
      rows.push(["Cohort 2 — " + c2Name, "NOT on " + grpName2 + " around the index event " + _medList(c2Meds)]);
    } else {
      rows.push(["Cohort 2 — " + c2Name, "Cohort 2 criteria met"]);
    }
  }

  for (var k = rows.length - 2; k < rows.length; k++) {
    if (k >= 0 && rows[k][1]) {
      rows[k][1] = rows[k][1].replace(/^On On /, "On ").replace(/^NOT on On /, "NOT on ");
    }
  }

  // Outcomes
  rows.push(["Outcomes", ""]);
  (study.outcomes || []).forEach(function (o) {
    var oname = o.outcome || "";
    var key = oname.toLowerCase().replace(/ /g, "").replace(/\+/g, "");
    if (key === "mortality") {
      rows.push([oname, "Deceased"]);
    } else if (key === "surgerymortality") {
      rows.push([oname, "Any surgical evacuation [" + surgCodesStr + "] OR Deceased"]);
    } else if (key === "surgery") {
      rows.push([oname, "Any surgical evacuation [" + surgCodesStr + "]"]);
    } else {
      var customCode = _outcomeCodes(oname, apC);
      rows.push([oname, customCode || "Deceased"]);
    }
  });

  // Covariates
  rows.push(["Covariates", ""]);
  (study.table1.before || []).forEach(function (sec) {
    sec.rows.forEach(function (r) {
      if (r.kind === "bin") return;
      if (typeof OMIT_CODES !== "undefined" && OMIT_CODES[r.code]) return;
      var label = (typeof LABEL_BY_CODE !== "undefined" && LABEL_BY_CODE[r.code]) || normalizeLabel(r.label, r.code);
      rows.push([label, _table1CodeSystem(r.code, sec.name)]);
    });
  });
  return rows;
}

/* ============================================================================
 * Small-cell suppression (Table 1 grid only)
 * ==========================================================================*/
var COUNT_RE = /\((\d{1,3}(?:,\d{3})*|\d+)\)/;

function _countValue(cell) {
  if (cell === null || cell === undefined) return null;
  var m = COUNT_RE.exec(String(cell));
  if (!m) return null;
  return parseInt(m[1].replace(/,/g, ""), 10);
}

function suppressTable1(rows) {
  var changes = [];
  for (var ri = 2; ri < rows.length; ri++) {
    var row = rows[ri];
    if (row.length < 9) continue;
    var blocks = [
      { counts: [1, 2], p: 3, asd: 4, phase: "Before" },
      { counts: [5, 6], p: 7, asd: 8, phase: "After" }
    ];
    blocks.forEach(function (bk) {
      var cvals = bk.counts.map(function (c) { return [_countValue(row[c]), c]; });
      var present = cvals.filter(function (vc) { return vc[0] !== null; });
      if (!present.length) return;
      var minV = Math.min.apply(null, present.map(function (vc) { return vc[0]; }));
      if (minV > THRESHOLD) return;
      [[bk.p, "P-value"], [bk.asd, "ASD"]].forEach(function (cr) {
        var col = cr[0], role = cr[1];
        var old = row[col];
        if (old !== MISSING && old !== "" && old !== null && old !== undefined) {
          row[col] = MISSING;
          changes.push({ row: ri, label: row[0], phase: bk.phase, role: role,
                         old: old, new: MISSING,
                         reason: "either cohort count " + LE + THRESHOLD + " (min=" + minV + ")" });
        }
      });
      cvals.forEach(function (vc) {
        var v = vc[0], c = vc[1];
        if (v === null || v > THRESHOLD) return;
        var old = row[c];
        var newV = String(old).replace(COUNT_RE, "(" + LE + THRESHOLD + ")");
        if (newV !== old) {
          row[c] = newV;
          changes.push({ row: ri, label: row[0], phase: bk.phase,
                         role: "Cohort " + ((c === 1 || c === 5) ? 1 : 2) + " count",
                         old: old, new: newV, reason: "count " + v + " " + LE + THRESHOLD });
        }
      });
    });
  }
  return changes;
}

/* ============================================================================
 * Verification gates
 * ==========================================================================*/
function _phaseBlocks(txt) {
  var mb = /characteristics before propensity/i.exec(txt);
  var ma = /characteristics after propensity/i.exec(txt);
  if (!mb || !ma) return [null, null];
  var before = txt.substring(mb.index + mb[0].length, ma.index);
  var tail = txt.substring(ma.index + ma[0].length);
  var me = /\bResults\b|\bFollow-up Time\b/.exec(tail);
  var after = me ? tail.substring(0, me.index) : tail;
  return [before, after];
}

function indepParsePhase(block, codes) {
  var rows = block.split(/(?<![\d.])1 2 /);
  var res = {};
  var tailRe = new RegExp("([\\d,]+) ([\\d,]+) (\\d+(?:\\.\\d+)?)% (\\d+(?:\\.\\d+)?)% (" + PA + ") (" + PA + ")(?:\\s|$)");
  codes.forEach(function (code) {
    res[code] = null;
    var cre = new RegExp("^(?:1 2 )?" + code.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b");
    for (var i = 0; i < rows.length; i++) {
      var rt = rows[i].trim();
      if (!cre.test(rt)) continue;
      var m = tailRe.exec(rt);
      if (!m) continue;
      res[code] = { c1_count: m[1].replace(/,/g, ""), c2_count: m[2].replace(/,/g, ""),
                    c1_pct: parseFloat(m[3]), c2_pct: parseFloat(m[4]), p: m[5], asd: m[6] };
      break;
    }
  });
  return res;
}

function _expP(p) {
  if (p === null || p === undefined || p === "--") return MISSING;
  if (p === "<0.001") return "<0.001";
  var v = parseFloat(p);
  return v === 0 ? "<0.001" : v.toFixed(2);
}

function _expAsd(a) {
  if (a === null || a === undefined || a === "--") return MISSING;
  if (a === "<0.001") return "<0.001";
  var v = parseFloat(a);
  if (isNaN(v)) return MISSING;
  return v.toFixed(3);
}

function verifyTable1(study, t1Rows) {
  var txt = study.raw_text;
  var pb = _phaseBlocks(txt);
  var before = pb[0], after = pb[1];
  var problems = [];
  if (before === null) return [false, ["could not split phase blocks"]];

  var codeRows = [];
  var ri = 2;
  (study.table1.before || []).forEach(function (sec) {
    ri++; // section header
    sec.rows.forEach(function (r) {
      if (r.kind !== "bin" && OMIT_CODES[r.code]) return; // match buildTable1 row omission
      codeRows.push([ri, r]); ri++;
    });
  });

  var allCodes = codeRows.filter(function (cr) { return cr[1].kind === "cat"; })
                         .map(function (cr) { return cr[1].code; });
  var indep = { before: indepParsePhase(before, allCodes), after: indepParsePhase(after, allCodes) };
  var src = { before: before, after: after };

  codeRows.forEach(function (cr) {
    var ri2 = cr[0], r = cr[1];
    if (r.kind !== "cat") return;
    var code = r.code;
    var row = t1Rows[ri2];
    [["before", [1, 2, 3, 4]], ["after", [5, 6, 7, 8]]].forEach(function (pc) {
      var ph = pc[0], cols = pc[1];
      var s = indep[ph][code];
      if (!s) { problems.push(row[0] + " [" + ph + "] code " + code + " not found in text"); return; }
      [[cols[0], "c1_count", "c1_pct", 1], [cols[1], "c2_count", "c2_pct", 2]].forEach(function (cc) {
        var cell = String(row[cc[0]]);
        if (cell.indexOf("(" + LE) >= 0) return;
        var m = /(\d+(?:\.\d+)?)% \(([\d,]+)\)/.exec(cell);
        if (!m) return;
        var gp = parseFloat(m[1]), gn = m[2].replace(/,/g, "");
        if (s[cc[1]] !== null && gn !== s[cc[1]])
          problems.push(row[0] + " [" + ph + "] c" + cc[3] + "_n grid=" + gn + " text=" + s[cc[1]]);
        if (s[cc[2]] !== null && Math.abs(gp - s[cc[2]]) > 0.11)
          problems.push(row[0] + " [" + ph + "] c" + cc[3] + "_pct grid=" + gp + " text=" + s[cc[2]]);
      });
      if (String(row[cols[2]]) !== MISSING && String(row[cols[2]]) !== _expP(s.p))
        problems.push(row[0] + " [" + ph + "] p grid=" + row[cols[2]] + " text->" + _expP(s.p));
      if (String(row[cols[3]]) !== MISSING && String(row[cols[3]]) !== _expAsd(s.asd))
        problems.push(row[0] + " [" + ph + "] asd grid=" + row[cols[3]] + " text->" + _expAsd(s.asd));
    });
  });
  return [problems.length === 0, problems];
}

var PCT_RE = /(\d+(?:\.\d+)?)%/g;
var BADMASK_RE = new RegExp("\\(" + LE + "(\\d+)\\)", "g");

function _pcts(s) {
  if (s === null || s === undefined) return [];
  var out = [], m;
  PCT_RE.lastIndex = 0;
  while ((m = PCT_RE.exec(String(s))) !== null) out.push(m[1]);
  return out;
}

function verifySuppression(cleanRows, maskedRows, changes) {
  var problems = [];
  var BLOCKS = [
    { counts: [1, 2], p: 3, asd: 4 },
    { counts: [5, 6], p: 7, asd: 8 }
  ];
  for (var ri = 2; ri < cleanRows.length; ri++) {
    BLOCKS.forEach(function (bk) {
      var orig = bk.counts.map(function (c) {
        return c < cleanRows[ri].length ? _countValue(cleanRows[ri][c]) : null;
      });
      var present = orig.filter(function (v) { return v !== null; });
      if (!present.length) return;
      var should = Math.min.apply(null, present) <= THRESHOLD;
      var mrow = maskedRows[ri];
      var pBlank = (bk.p < mrow.length ? mrow[bk.p] : null) === MISSING;
      var asdBlank = (bk.asd < mrow.length ? mrow[bk.asd] : null) === MISSING;
      if (should && !(pBlank && asdBlank))
        problems.push("row " + ri + " MISSED suppression (min=" + Math.min.apply(null, present) + ")");
      if (!should) {
        var crow = cleanRows[ri];
        if (mrow[bk.p] !== crow[bk.p] || mrow[bk.asd] !== crow[bk.asd])
          problems.push("row " + ri + " OVER-applied suppression (min=" + Math.min.apply(null, present) + ")");
      }
    });
  }
  for (ri = 2; ri < maskedRows.length; ri++) {
    BLOCKS.forEach(function (bk) {
      bk.counts.forEach(function (c) {
        var mv = c < maskedRows[ri].length ? maskedRows[ri][c] : null;
        var cv = c < cleanRows[ri].length ? cleanRows[ri][c] : null;
        if (mv === null || mv === undefined) return;
        var s = String(mv);
        BADMASK_RE.lastIndex = 0;
        var bm;
        while ((bm = BADMASK_RE.exec(s)) !== null) {
          if (bm[1] !== String(THRESHOLD)) problems.push("row " + ri + " col " + c + ": bad mask (" + LE + bm[1] + ")");
        }
        var pm = COUNT_RE.exec(s);
        if (pm && parseInt(pm[1].replace(/,/g, ""), 10) <= THRESHOLD)
          problems.push("row " + ri + " col " + c + ": plain <=" + THRESHOLD + " count remains: " + s);
        var cvv = _countValue(cv);
        if (cvv !== null && cvv > THRESHOLD && mv !== cv)
          problems.push("row " + ri + " col " + c + ": large count changed " + cv + " -> " + mv);
        if (JSON.stringify(_pcts(cv)) !== JSON.stringify(_pcts(mv)))
          problems.push("row " + ri + " col " + c + ": percentage changed " + cv + " -> " + mv);
      });
    });
  }
  // idempotency
  var rerun = JSON.parse(JSON.stringify(maskedRows));
  var changes2 = suppressTable1(rerun);
  if (changes2.length !== 0)
    problems.push("not idempotent: re-run made " + changes2.length + " changes");
  // change list well-formed
  changes.forEach(function (ch) {
    ["row", "label", "phase", "role", "old", "new", "reason"].forEach(function (k) {
      if (!(k in ch)) problems.push("change missing key " + k);
    });
  });
  return [problems.length === 0, problems];
}

/* ============================================================================
 * PSM Balance QC — covariate-balance red-flag detection (R1–R7)
 * Flags ASD threshold breaches, worsening after matching, direction-of-bias,
 * key-confounder status, and small-cell suppression. Returns a verdict and
 * per-covariate flags for the UI panel.
 * ==========================================================================*/
function _parseMean(cell) {
  if (!cell || cell === MISSING) return null;
  var m = /^([\d.]+)\s*±/.exec(String(cell).trim());
  return m ? parseFloat(m[1]) : null;
}

function psmBalanceQC(study, t1Rows) {
  var ASD_THRESHOLD = 0.10;
  var flags = [];

  var combined = (study.cohort1 || "") + " " + (study.cohort2 || "");
  var hasPlatelet = /plt|platelet/i.test(combined);
  var keyKeywords = hasPlatelet ? ["platelet", "age"] : ["age"];
  var favorableDir = { "platelet": "higher", "age": "lower" };

  for (var i = 2; i < t1Rows.length; i++) {
    var row = t1Rows[i];
    if (row.length < 9) continue;
    if (row[1] === "" && row[2] === "") continue;

    var label = row[0];
    var beforeAsd = _num(row[4]);
    var afterAsd = _num(row[8]);

    if (afterAsd === null) {
      if (String(row[8]) === MISSING) {
        flags.push({ label: label, severity: "INFO", rules: ["R5"],
          message: "ASD suppressed (small-cell count \u226410) \u2014 unverifiable",
          beforeAsd: beforeAsd, afterAsd: null, direction: "n/a" });
      }
      continue;
    }

    var r1 = afterAsd > ASD_THRESHOLD;
    var r2 = (beforeAsd !== null) && (afterAsd > beforeAsd + 0.001);

    var labelLower = label.toLowerCase();
    var isKey = false, matchedKeyword = null;
    for (var k = 0; k < keyKeywords.length; k++) {
      if (labelLower.indexOf(keyKeywords[k]) >= 0) { isKey = true; matchedKeyword = keyKeywords[k]; break; }
    }

    var direction = "unknown", favorsIntervention = false;
    if (matchedKeyword && favorableDir[matchedKeyword]) {
      var afterMean1 = _parseMean(row[5]);
      var afterMean2 = _parseMean(row[6]);
      if (afterMean1 !== null && afterMean2 !== null) {
        var diff = afterMean1 - afterMean2;
        var favDir = favorableDir[matchedKeyword];
        if (favDir === "higher") {
          direction = diff > 0.001 ? "favors intervention" : (diff < -0.001 ? "favors control" : "balanced");
          favorsIntervention = diff > 0.001;
        } else {
          direction = diff < -0.001 ? "favors intervention" : (diff > 0.001 ? "favors control" : "balanced");
          favorsIntervention = diff < -0.001;
        }
      }
    }

    var rules = [];
    if (r1) rules.push("R1");
    if (r2) rules.push("R2");
    if (direction !== "unknown") rules.push("R3");
    if (isKey) rules.push("R4");

    var severity = null, message = "";
    if (r1 && r2 && favorsIntervention && isKey) {
      severity = "CRITICAL";
      message = "Key confounder imbalanced (ASD " + afterAsd.toFixed(3) + "), worsened after matching, favors intervention. Consider exact matching or caliper on this covariate.";
    } else if (r1 && isKey) {
      severity = "HIGH";
      message = "Key confounder imbalanced after matching (ASD " + afterAsd.toFixed(3) + "). Direction: " + direction + ". Disclose in Limitations; consider covariate adjustment.";
    } else if (r1 && r2 && favorsIntervention) {
      severity = "HIGH";
      message = "Imbalanced (ASD " + afterAsd.toFixed(3) + "), worsened after matching, favors intervention. Disclose in Limitations.";
    } else if (r1 && r2) {
      severity = "MODERATE";
      message = "Imbalanced (ASD " + afterAsd.toFixed(3) + ") and worsened after matching.";
    } else if (r1) {
      severity = "MODERATE";
      message = "Imbalanced after matching (ASD " + afterAsd.toFixed(3) + ").";
    } else if (r2) {
      severity = "MODERATE";
      message = "Worsened after matching (before " + (beforeAsd !== null ? beforeAsd.toFixed(3) : "?") + ", after " + afterAsd.toFixed(3) + ").";
    }

    if (severity) {
      flags.push({ label: label, severity: severity, rules: rules, message: message,
        beforeAsd: beforeAsd, afterAsd: afterAsd, direction: direction });
    }
  }

  var hasCritical = flags.some(function(f) { return f.severity === "CRITICAL"; });
  var hasHigh = flags.some(function(f) { return f.severity === "HIGH"; });
  var hasModerate = flags.some(function(f) { return f.severity === "MODERATE"; });
  var hasInfo = flags.some(function(f) { return f.severity === "INFO"; });

  var verdict;
  if (hasCritical) verdict = "Re-analysis recommended";
  else if (hasHigh) verdict = "Consider re-analysis; at minimum, detailed Limitations disclosure";
  else if (hasModerate) verdict = "No re-analysis needed; disclose flagged items in Limitations";
  else if (hasInfo) verdict = "Balance acceptable; note suppressed cells in Methods";
  else verdict = "Balance acceptable; no flags";

  return { verdict: verdict, flags: flags, threshold: ASD_THRESHOLD };
}

var api = {
  normalizeText: normalizeText,
  docxTextFromXml: docxTextFromXml,
  parseStudyText: parseStudyText,
  buildTable1: buildTable1,

if (typeof module !== "undefined" && module.exports) module.exports = api;

<script>
(function () {
"use strict";
var T = window.TriNetX;
var statusEl = document.getElementById("status");
var outEl = document.getElementById("out");

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function setStatus(html) { statusEl.innerHTML = html; }

/* ---------- table model ----------
   Each table is a list of rows; each row is a list of cells:
   { t: text, span: colspan, bold: bool, ital: bool, align: 'l'|'c',
     vr: bool (right vertical rule), bt/bb: top/bottom border }        */

function _shortCohortName(s) {
  if (!s) return "";
  if (/MMAE/i.test(s)) return "MMAE";
  if (/Medical|MM/i.test(s)) return "MM";
  if (/Surgery|Sx/i.test(s)) return "Surgery";
  var words = s.trim().split(/\s+/);

  return words.map(function(w){ return w.charAt(0).toUpperCase(); }).join("");
}

function modelT1(t1, study) {
  var c1 = study ? study.cohort1 : "Cohort 1";
  var c2 = study ? study.cohort2 : "Cohort 2";
  var c1Short = _shortCohortName(c1);
  var c2Short = _shortCohortName(c2);
  
  var title = (t1[0] && t1[0][0]) ? t1[0][0] : ("Table 1. Baseline characteristics before and after propensity-score matching — " + c1Short + " vs " + c2Short);
  title = title.replace(/^Table 1:\s*/i, "Table 1. ").replace(/\s*\(PSM\)/i, "");
  
  var subtitle = "";

  var rows = [];
  // Row 0: Top Header Band
  rows.push([
    { t: "", span: 1, align: "l", isHeader: true, isTopHeader: true },
    { t: "Before PSM", span: 4, bold: true, align: "c", isHeader: true, isTopHeader: true },
    { t: "After PSM", span: 4, bold: true, align: "c", isHeader: true, isTopHeader: true }
  ]);

  // Row 1: Subheader Row
  var sub = [{ t: t1[1][0], ital: true, align: "l", isHeader: true, isSubHeader: true }];
  for (var j = 1; j < 9; j++) {
    sub.push({
      t: t1[1][j], bold: true, align: "c", isHeader: true, isSubHeader: true,
      nowrap: (j === 3 || j === 4 || j === 7 || j === 8)
    });
  }
  rows.push(sub);

  // Data Rows
  for (var i = 2; i < t1.length; i++) {
    var r = t1[i];
    var isSec = r.length === 9 && r[1] === "" && r[2] === "" && r[0] !== "";
    var isLast = (i === t1.length - 1);
    var row = [];
    for (var j2 = 0; j2 < 9; j2++) {
      row.push({
        t: r[j2], align: j2 === 0 ? "l" : "c",
        bold: isSec, ital: isSec,
        isSec: isSec, isLast: isLast,
        cls: isSec ? "sec" : (j2 === 0 ? "lbl" : "num"),
        nowrap: (j2 === 3 || j2 === 4 || j2 === 7 || j2 === 8)
      });
    }
    rows.push(row);
  }
  return { title: title, subtitle: subtitle, rows: rows, type: "t1", footnote: "PSM = propensity-score matching; ASD = absolute standardized difference; MMAE = middle meningeal artery embolization; MM = medical management. Values are mean \u00b1 SD or % (n)." };
}

function modelT2(t2, study) {
  var c1 = study ? study.cohort1 : "Cohort 1";
  var c2 = study ? study.cohort2 : "Cohort 2";
  var c1Short = _shortCohortName(c1);
  var c2Short = _shortCohortName(c2);

  var title = (t2[0] && t2[0][0]) ? t2[0][0] : ("Table 2. Primary and secondary outcomes before and after propensity-score matching — " + c1Short + " vs " + c2Short);
  title = title.replace(/^Table 2:\s*/i, "Table 2. ").replace(/\s*\(PSM\)/i, "");

  var subtitle = "";

  var rows = [];
  var hdr = [];
  for (var j = 0; j < 6; j++) {
    hdr.push({
      t: t2[1][j],
      bold: j > 0,
      ital: j === 0,
      align: j === 0 ? "l" : "c",
      isHeader: true, isSubHeader: true,
      nowrap: (j === 4 || j === 5)
    });
  }
  rows.push(hdr);

  for (var i = 2; i < t2.length; i++) {
    var isLast = (i === t2.length - 1);
    var row = [];
    for (var j2 = 0; j2 < 6; j2++) {
      row.push({
        t: t2[i][j2],
        align: j2 === 0 ? "l" : "c",
        isLast: isLast,
        cls: j2 === 0 ? "lbl" : "num",
        nowrap: (j2 === 4 || j2 === 5)
      });
    }
    rows.push(row);
  }
  var _tw = study ? T.timeWindowWords(study) : "Ninety-day";
  return { title: title, subtitle: subtitle, rows: rows, type: "t2", footnote: "MMAE = middle meningeal artery embolization; MM = medical management; HR = hazard ratio; CI = confidence interval. Values are % (n); event probability rates are " + _tw + " Kaplan-Meier estimates." };
}

/* ---------- PSM Balance QC rendering ---------- */
function _sevLabel(sev) {
  return sev.charAt(0) + sev.slice(1).toLowerCase();
}

function _whyExplanation(f) {
  var label = f.label;
  var parts = [];
  var isKey = f.rules.indexOf("R4") >= 0;
  var imbalanced = f.rules.indexOf("R1") >= 0;
  var worsened = f.rules.indexOf("R2") >= 0;
  var dir = f.direction || "unknown";

  if (isKey && imbalanced && worsened) {
    parts.push("The " + label + " distributions had insufficient overlap between cohorts. " +
      "The intervention arm had " + (dir === "favors intervention" ? "more favorable" : "less favorable") +
      " baseline values, and the matching algorithm could not fully correct this imbalance. " +
      "This is a key confounder, so residual imbalance directly threatens the validity of the treatment effect estimate.");
  } else if (isKey && imbalanced) {
    parts.push("The " + label + " distributions differed between cohorts even after matching. " +
      "As a key confounder, this covariate requires adequate balance for unbiased estimation. " +
      "The propensity score model may not have fully captured its contribution to treatment assignment.");
  } else if (imbalanced && worsened) {
    parts.push("Matching paradoxically increased the imbalance in " + label + ". " +
      "This can occur when the matching algorithm prioritizes balance on other covariates at the expense of this one.");
  } else if (imbalanced) {
    parts.push("The " + label + " distributions differed between cohorts after matching. " +
      "The propensity score model did not fully capture this covariate's contribution to treatment assignment.");
  } else if (worsened) {
    parts.push("Matching increased the imbalance in " + label + " (before ASD " +
      (f.beforeAsd !== null ? f.beforeAsd.toFixed(3) : "?") + ", after ASD " +
      (f.afterAsd !== null ? f.afterAsd.toFixed(3) : "?") + "). " +
      "This can occur when the matching algorithm prioritizes balance on other covariates.");
  }
  return parts.join(" ");
}

function _reanalysisGuidance(f) {
  var label = f.label;
  var isKey = f.rules.indexOf("R4") >= 0;
  var imbalanced = f.rules.indexOf("R1") >= 0;
  var worsened = f.rules.indexOf("R2") >= 0;
  var suggestions = [];

  if (isKey && imbalanced) {
    suggestions.push("Re-run TriNetX analysis with exact matching on " + label + " categories, or use a tighter caliper (0.05 instead of 0.10).");
    suggestions.push("Alternatively, remove " + label + " from the matching model and adjust for it in the outcome regression.");
  } else if (imbalanced && worsened) {
    suggestions.push("Consider removing " + label + " from the matching model and using it as a covariate in the outcome regression instead.");
  } else if (imbalanced) {
    suggestions.push("Consider covariate adjustment for " + label + " in the outcome model, or stratified analysis.");
  } else if (worsened) {
    suggestions.push("Consider removing " + label + " from the matching model and using it as a covariate in the outcome regression instead.");
  }
  return suggestions;
}

function _limitationsText(flags, hasCritical, allFlags) {
  /* Publication-quality limitations template following Ross & Bibler Zaidi (2019):
     (1) describe the limitation, (2) explain implication, (3) provide alternative
     approaches, (4) describe mitigation steps. Incorporates unmeasured confounding,
     EHR data-source bias, cell suppression, and causal caveat. */

  /* Build covariate list with ASD values and direction */
  var covList = [];
  var hasSuppressed = false;
  for (var i = 0; i < flags.length; i++) {
    var f = flags[i];
    var entry = f.label;
    if (f.afterAsd !== null) {
      entry += " (post-match ASD " + f.afterAsd.toFixed(3);
      if (f.direction && f.direction !== "unknown" && f.direction !== "n/a" && f.direction !== "balanced") {
        entry += ", " + f.direction;
      }
      entry += ")";
    } else {
      entry += " (ASD suppressed, count \u226410)";
      hasSuppressed = true;
    }
    covList.push(entry);
  }

  /* Detect key confounders, bidirectional imbalance, PSM paradox, R5 suppression */
  var hasKeyConfounder = false;
  var favorsIntervention = false;
  var favorsControl = false;
  var hasWorsened = false;
  for (var j = 0; j < flags.length; j++) {
    if (flags[j].rules.indexOf("R4") >= 0) hasKeyConfounder = true;
    if (flags[j].direction === "favors intervention") favorsIntervention = true;
    if (flags[j].direction === "favors control") favorsControl = true;
    if (flags[j].rules.indexOf("R2") >= 0) hasWorsened = true;
  }
  var bidirectional = favorsIntervention && favorsControl;

  var hasR5 = false;
  for (var k = 0; k < allFlags.length; k++) {
    if (allFlags[k].rules.indexOf("R5") >= 0) hasR5 = true;
  }

  var parts = [];

  /* (1) Describe the limitation — name specific covariates with ASD and direction */
  if (hasCritical) {
    parts.push("Propensity-score matching did not achieve adequate balance for " + covList.join("; ") + ".");
  } else {
    parts.push("Propensity-score matching did not fully balance " + covList.join("; ") + ".");
  }

  /* Direction of imbalance */
  if (bidirectional) {
    parts.push("These residual imbalances ran in both directions and cannot be assumed to cancel one another.");
  } else if (favorsIntervention && !favorsControl) {
    parts.push("The residual imbalance favors the intervention arm, potentially inflating the apparent treatment benefit.");
  } else if (favorsControl && !favorsIntervention) {
    parts.push("The residual imbalance favors the comparator arm, potentially attenuating the apparent treatment effect.");
  }

  /* (2) Explain implication — unmeasured confounding / treatment selection bias */
  if (hasKeyConfounder) {
    parts.push("Treatment selection may reflect clinical factors not fully captured in this administrative dataset, including disease severity, comorbidity burden, functional status, and provider judgment.");
    parts.push("Residual confounding from these unmeasured factors could account for some or all of the observed association.");
  } else {
    parts.push("Residual confounding from unmeasured covariates may bias the treatment effect estimate.");
  }

  /* PSM paradox if applicable */
  if (hasWorsened) {
    parts.push("Matching paradoxically worsened balance on at least one covariate, which can occur when the algorithm prioritizes overall balance at the expense of specific covariates.");
  }

  /* EHR data source limitations */
  parts.push("Electronic health record inclusion depends on healthcare utilization, which may select a population that differs from the general population.");

  /* Cell suppression */
  if (hasSuppressed || hasR5) {
    parts.push("The platform obfuscates cells of 10 or fewer, limiting balance assessment for rare covariates and precluding analysis of very small subgroups.");
  }

  /* (3) Alternative approaches — sensitivity analyses */
  if (hasCritical) {
    parts.push("Sensitivity analyses, including E-values to quantify the minimum unmeasured confounding strength sufficient to explain the observed effect, and covariate adjustment in the outcome model, are recommended.");
    parts.push("Re-analysis with exact matching or tighter caliper settings on the flagged covariates is also advised.");
  } else {
    parts.push("Covariate adjustment for these variables in sensitivity analyses is warranted.");
  }

  /* (4) Causal caveat */
  parts.push("These findings are associative, not causal, and require prospective confirmation before informing individual treatment decisions.");

  return parts.join(" ");
}

function renderBalanceQC(qc) {
  if (!qc || !qc.flags) return "";
  var v = qc.verdict || "";
  var cls = "ok";
  if (/re-analysis recommended/i.test(v)) cls = "critical";
  else if (/consider re-analysis/i.test(v)) cls = "high";
  else if (/no re-analysis needed/i.test(v)) cls = "moderate";
  else if (/note suppressed/i.test(v)) cls = "ok";

  var counts = { CRITICAL: 0, HIGH: 0, MODERATE: 0, INFO: 0 };
  for (var i = 0; i < qc.flags.length; i++) counts[qc.flags[i].severity] = (counts[qc.flags[i].severity] || 0) + 1;

  var html = '<div class="qc-card">';
  html += '<div class="qc-card-title">PSM Balance QC &mdash; Covariate Balance Audit</div>';
  html += '<div class="qc-verdict ' + cls + '">' + esc(v) + '</div>';

  if (qc.flags.length > 0) {
    html += '<div class="qc-summary">';
    var parts = [];
    if (counts.CRITICAL) parts.push('<span class="badge-sm critical">' + counts.CRITICAL + ' Critical</span>');
    if (counts.HIGH) parts.push('<span class="badge-sm high">' + counts.HIGH + ' High</span>');
    if (counts.MODERATE) parts.push('<span class="badge-sm moderate">' + counts.MODERATE + ' Moderate</span>');
    if (counts.INFO) parts.push('<span class="badge-sm info">' + counts.INFO + ' Info</span>');
    html += parts.join(" ") + " &nbsp;ASD threshold: " + qc.threshold;
    html += "</div>";

    html += '<table class="qc-table"><thead><tr>';
    html += "<th>Covariate</th><th>Severity</th><th>Rules</th><th>Before ASD</th><th>After ASD</th><th>Direction</th><th>Notes</th>";
    html += "</tr></thead><tbody>";
    for (var j = 0; j < qc.flags.length; j++) {
      var f = qc.flags[j];
      html += "<tr>";
      html += "<td>" + esc(f.label) + "</td>";
      html += '<td><span class="qc-sev ' + f.severity + '">' + _sevLabel(f.severity) + "</span></td>";
      html += "<td>" + esc(f.rules.join(", ")) + "</td>";
      html += "<td>" + (f.beforeAsd !== null ? f.beforeAsd.toFixed(3) : "&mdash;") + "</td>";
      html += "<td>" + (f.afterAsd !== null ? f.afterAsd.toFixed(3) : "suppressed") + "</td>";
      html += "<td>" + esc(f.direction) + "</td>";
      html += "<td>" + esc(f.message) + "</td>";
      html += "</tr>";
    }
    html += "</tbody></table>";
  } else {
    html += '<div class="qc-summary">All post-match covariates have ASD &le; ' + qc.threshold + ". No balance flags.</div>";
  }

  /* Why this happened + Re-analysis guidance + Limitations for CRITICAL / HIGH flags */
  var hasCritical = counts.CRITICAL > 0;
  var hasHigh = counts.HIGH > 0;
  if (hasCritical || hasHigh) {
    var critHighFlags = [];
    for (var k = 0; k < qc.flags.length; k++) {
      var fl = qc.flags[k];
      if (fl.severity === "CRITICAL" || fl.severity === "HIGH") critHighFlags.push(fl);
    }

    /* Why this happened */
    html += '<div class="qc-why">';
    html += '<div class="qc-why-title">Why this happened:</div>';
    for (var w = 0; w < critHighFlags.length; w++) {
      var why = _whyExplanation(critHighFlags[w]);
      if (why) html += "<div style='margin-bottom:6px;'>&bull; " + esc(why) + "</div>";
    }
    html += "</div>";

    /* Recommended re-analysis */
    html += '<div class="qc-guidance">';
    html += '<div class="qc-guidance-title">Recommended re-analysis:</div>';
    html += "<ul style='margin:0;padding-left:0;list-style:none;'>";
    var seen = {};
    for (var g = 0; g < critHighFlags.length; g++) {
      var suggestions = _reanalysisGuidance(critHighFlags[g]);
      for (var s = 0; s < suggestions.length; s++) {
        if (!seen[suggestions[s]]) {
          seen[suggestions[s]] = true;
          html += "<li>&rarr; " + esc(suggestions[s]) + "</li>";
        }
      }
    }
    html += "</ul></div>";

    /* Limitations wording — publication-quality template */
    html += '<div class="qc-limitations">';
    html += '<div class="qc-limitations-title">If this imbalance persists after re-analysis, include the following in your Limitations section:</div>';
    html += esc(_limitationsText(critHighFlags, hasCritical, qc.flags));
    html += "</div>";
  }

  html += '<div class="qc-note">Rules: R1 = post-match ASD &gt; 0.10; R2 = ASD worsened after matching; R3 = direction of bias assessed; R4 = key confounder (platelets, age); R5 = ASD suppressed (count &le;10, unverifiable).</div>';
  html += "</div>";
  return html;
}

function copyTable(btn, model, widths) {
  var html = wordHtml(model, widths);

    btn.classList.add("done");
    setTimeout(function () { btn.textContent = old; btn.classList.remove("done"); }, 1600);
  }
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { btn.textContent = "Copy failed"; }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && window.ClipboardItem) {
    var item = new ClipboardItem({
      "text/html": new Blob([html], { type: "text/html" }),
      "text/plain": new Blob([text], { type: "text/plain" })
    });
    navigator.clipboard.write([item]).then(done, fallback);
  } else fallback();
}

      xml += '<w:tcBorders>';
