      xml += '<w:bottom w:val="' + ((isTop || isSub) ? "single" : (isLast ? "single" : "nil")) + '"' + ((isTop || isSub) ? ' w:sz="6" w:space="0" w:color="000000"' : (isLast ? ' w:sz="16" w:space="0" w:color="000000"' : '')) + '/>';
      xml += '<w:left w:val="nil"/>';
      xml += '<w:right w:val="nil"/>';
      xml += '</w:tcBorders>';
      xml += '</w:tcPr>';

      xml += '<w:p><w:pPr>';
      xml += '<w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/>';
      xml += '<w:jc w:val="' + (c.align === "l" ? "left" : "center") + '"/>';
      xml += '<w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/><w:sz w:val="20"/><w:szCs w:val="24"/></w:rPr>';
      xml += '</w:pPr>';

      var txt = c.t == null ? "" : String(c.t);

      xml += '<w:r><w:rPr>';
      xml += '<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>';
      if (c.bold) xml += '<w:b/><w:bCs/>';
      if (c.ital) xml += '<w:i/><w:iCs/>';
      xml += '<w:sz w:val="20"/><w:szCs w:val="24"/>';
      xml += '</w:rPr>';
      xml += '<w:t xml:space="preserve">' + escXml(txt) + '</w:t>';
      xml += '</w:r></w:p></w:tc>';
    }
    xml += '</w:tr>';
  }

  xml += '</w:tbl>';
  if (model.footnote) {
    xml += '<w:p><w:pPr><w:spacing w:before="40" w:after="120" w:line="240" w:lineRule="auto"/></w:pPr>'
      + '<w:r><w:rPr>'
      + '<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>'
      + '<w:i/><w:iCs/>'
      + '<w:color w:val="000000"/>'
      + '<w:sz w:val="18"/><w:szCs w:val="18"/>'
      + '</w:rPr>'
      + '<w:t xml:space="preserve">' + escXml(model.footnote) + '</w:t>'
      + '</w:r></w:p>';
  }
  return xml;
}


async function downloadDocxFile(tablesList, filename) {
  try {
    var JSZipLib = (typeof JSZip !== "undefined" ? JSZip : (typeof window !== "undefined" ? window.JSZip : globalThis.JSZip));
    if (!JSZipLib) {
      alert("JSZip library missing.");
      return;
    }
    var zip = new JSZipLib();
    zip.file("[Content_Types].xml",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
      '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
      '</Types>'
    );
    zip.file("_rels/.rels",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
      '</Relationships>'
    );
    zip.file("word/_rels/document.xml.rels",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      '</Relationships>'
    );
    zip.file("word/styles.xml",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
      '<w:docDefaults><w:rPrDefault><w:rPr>' +
      '<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>' +
      '<w:sz w:val="20"/><w:color w:val="000000"/>' +
      '</w:rPr></w:rPrDefault></w:docDefaults>' +
      '</w:styles>'
    );
    zip.file("word/document.xml", generateDocxDocumentXml(tablesList));

    var blob = await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
  } catch (err) {
    alert("Error generating DOCX: " + (err && err.message || err));
  }
}

function generateDocxDocumentXml(tablesList) {
  var xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" ' +
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
    '<w:body>';

  for (var i = 0; i < tablesList.length; i++) {
    var t = tablesList[i];
    xml += buildDocxTableXml(t.model, t.widths);
    if (i < tablesList.length - 1) {
      xml += '<w:p><w:pPr><w:spacing w:before="240" w:after="240"/></w:pPr></w:p>';
    }
  }

  xml += '<w:sectPr>' +
    '<w:pgSz w:w="15840" w:h="12240" w:orient="landscape"/>' +
    '<w:pgMar w:top="1008" w:right="1008" w:bottom="1008" w:left="1008" w:header="720" w:footer="720" w:gutter="0"/>' +
    '<w:cols w:space="720"/>' +
    '<w:docGrid w:linePitch="360"/>' +
    '</w:sectPr>';
  xml += '</w:body></w:document>';
  return xml;
}

function tableCard(cpId, cpLabel, dlId, dlLabel, model, titlePrefix, scroll) {
  return '<div class="tbl-card"><div class="tblhead" style="display:flex;gap:10px;justify-content:flex-end;">'
    + '<button class="copybtn" id="' + cpId + '">' + cpLabel + '</button>'
    + '<button class="copybtn" id="' + dlId + '">' + dlLabel + '</button>'
    + '</div><div class="' + (scroll ? "tscroll" : "") + '">'
    + renderModel(model) + "</div></div>";
}

function render(study, t1, t2, s1, changes, gate1, gate2, originalFileName, qcResult) {
  var ok = gate1[0] && gate2[0];
  var badge = ok
    ? '<span class="badge ok">&#10004; Verified &mdash; dual-parser + suppression audit passed</span>'
    : '<span class="badge bad">&#10006; Verification FAILED &mdash; values not certified</span>';
  var nb = study.phase_ns.before || ["?", "?"];
  var na = study.phase_ns.after || ["?", "?"];
  var meta = '<div class="meta"><b>Analysis:</b> ' + esc(study.title || "(untitled)") + "<br>"
    + '<b>Cohort 1:</b> ' + esc(study.cohort1) + " &nbsp; <b>Cohort 2:</b> " + esc(study.cohort2) + "<br>"
    + "<b>Before PSM:</b> " + nb[0].toLocaleString("en-US") + " vs " + nb[1].toLocaleString("en-US")
    + " &nbsp; <b>After PSM:</b> " + na[0].toLocaleString("en-US") + " vs " + na[1].toLocaleString("en-US")
    + (study.time_window[0] ? "<br><b>Time window:</b> started " + esc(study.time_window[0]) + ", ended " + esc(study.time_window[1]) + " after" : "")
    + "</div>";

  var html = '<div class="card">' + badge + meta;
  if (!ok) {
    var probs = gate1[1].concat(gate2[1]);
    html += '<div class="err">' + esc(probs.slice(0, 40).join("\n")) + (probs.length > 40 ? "\n\u2026 (" + probs.length + " total)" : "") + "</div>";
  }
  html += "</div>";

  html += '<div class="card"><b>Small-cell suppression (&le;10) &mdash; ' + changes.length + ' cell' + (changes.length === 1 ? "" : "s") + ' modified</b>';
  if (changes.length) {
    html += '<ul class="summary">';
    var shown = 0;
    for (var i = 0; i < changes.length && shown < 60; i++, shown++) {
      var c = changes[i];
      html += "<li><b>" + esc(c.label) + "</b> [" + esc(c.phase) + " PSM, " + esc(c.role) + "]: <span class='mono'>" + esc(c.old) + " &rarr; " + esc(c.new) + "</span> <span class='note'>(" + esc(c.reason) + ")</span></li>";
    }
    if (changes.length > shown) html += "<li class='note'>\u2026 and " + (changes.length - shown) + " more</li>";
    html += "</ul>";
    html += '<div class="note">Note: TriNetX floors counts of 1&ndash;9 to 10 at source, so a (&le;10) cell may hide a true count as low as 1.</div>';
  } else {
    html += '<div class="note">No cells required suppression.</div>';
  }
  html += "</div>";

  if (qcResult) html += renderBalanceQC(qcResult);

  var m1 = modelT1(t1, study), m2 = modelT2(t2, study), m3 = modelS1(s1, study);

  html += '<div class="card" style="border: 2px solid #000; background: #fafcff;">';
  html += '<div style="font-weight: bold; font-size: 15px; margin-bottom: 6px; color: #000;">Download Standard Word (.docx) Files</div>';
  html += '<div style="font-size: 13px; color: #000; margin-bottom: 12px;">Click below to directly download publication-ready Word documents formatted to standard specs:</div>';
  html += '<div style="display: flex; gap: 12px; flex-wrap: wrap;">';
  html += '<button class="dlbtn" id="dlT1T2">&#128190; Download Word Document (Tables 1 &amp; 2)</button>';
  html += '<button class="dlbtn" id="dlS1">&#128190; Download Word Document (Table S1)</button>';
  html += '</div></div>';

  html += tableCard("cp1", "Copy Table 1 for Word", "dl1", "Download Table 1 (.docx)", m1, "Table 1:", true);
  html += tableCard("cp2", "Copy Table 2 for Word", "dl2", "Download Table 2 (.docx)", m2, "Table 2:", false);
  html += tableCard("cp3", "Copy Table S1 for Word", "dl3", "Download Table S1 (.docx)", m3, "Table S1:", false);
  outEl.innerHTML = html;

  var origBase = originalFileName ? originalFileName.replace(/\.docx$/i, "") : "TriNetX_Export";
  var fnT1T2 = "Table 1 and 2_" + origBase + ".docx";
  var fnS1 = "Table S1_" + origBase + ".docx";
  var fnT1 = "Table 1_" + origBase + ".docx";
  var fnT2 = "Table 2_" + origBase + ".docx";

  document.getElementById("dlT1T2").addEventListener("click", function () {
    downloadDocxFile([
      { model: m1, widths: WORD_W.t1 },
      { model: m2, widths: WORD_W.t2 }
    ], fnT1T2);
  });

  document.getElementById("dlS1").addEventListener("click", function () {
    downloadDocxFile([
      { model: m3, widths: WORD_W.s1 }
    ], fnS1);
  });

  document.getElementById("dl1").addEventListener("click", function () {
    downloadDocxFile([{ model: m1, widths: WORD_W.t1 }], fnT1);
  });
  document.getElementById("dl2").addEventListener("click", function () {
    downloadDocxFile([{ model: m2, widths: WORD_W.t2 }], fnT2);
  });
  document.getElementById("dl3").addEventListener("click", function () {
    downloadDocxFile([{ model: m3, widths: WORD_W.s1 }], fnS1);
  });

  document.getElementById("cp1").addEventListener("click", function () { copyTable(this, m1, WORD_W.t1); });
  document.getElementById("cp2").addEventListener("click", function () { copyTable(this, m2, WORD_W.t2); });
  document.getElementById("cp3").addEventListener("click", function () { copyTable(this, m3, WORD_W.s1); });
}

// Build the three Word tables (as {model,widths} lists) for one parsed study.
function buildWordModels(t1, t2, s1, study) {
  return {
    t1t2: [ { model: modelT1(t1, study), widths: WORD_W.t1 }, { model: modelT2(t2, study), widths: WORD_W.t2 } ],
    s1:   [ { model: modelS1(s1, study), widths: WORD_W.s1 } ]
  };
}

async function handleFile(file) {
  outEl.innerHTML = "";
  setStatus('<div class="card">Reading <b>' + esc(file.name) + "</b> \u2026</div>");
  try {
    var txt;
    if (/\.docx$/i.test(file.name)) {
      var zip = await JSZip.loadAsync(await file.arrayBuffer());
      var doc = zip.file("word/document.xml");
      if (!doc) throw new Error("word/document.xml not found \u2014 not a TriNetX DOCX export?");
      txt = T.docxTextFromXml(await doc.async("string"));
    } else {
      throw new Error("Unsupported file type \u2014 upload a .docx TriNetX export.");
    }

    var study = T.parseStudyText(txt);
    if (!study.phase_ns.before || !study.phase_ns.after)
      throw new Error("Could not locate the before/after characteristics tables. Is this a TriNetX 'Compare Outcomes' export?");

    var t1 = T.buildTable1(study);
    var t2 = T.buildTable2(study);
    var s1 = T.buildTableS1(study);
    var clean = JSON.parse(JSON.stringify(t1));
    var changes = T.suppressTable1(t1);
    var gate1 = T.verifyTable1(study, t1);
    var gate2 = T.verifySuppression(clean, t1, changes);
    var qcResult = T.psmBalanceQC(study, t1);
    setStatus("");
    render(study, t1, t2, s1, changes, gate1, gate2, file ? file.name : "", qcResult);
  } catch (e) {
    setStatus('<div class="card"><span class="badge bad">&#10006; Error</span><div class="err">' + esc(e && e.message || e) + "</div></div>");
  }
}



// Generate a .docx (as a Blob) from a tablesList, without triggering a download.
async function docxBlob(tablesList) {
  var JSZipLib = (typeof JSZip !== "undefined" ? JSZip : (typeof window !== "undefined" ? window.JSZip : globalThis.JSZip));
  var zip = new JSZipLib();
  zip.file("[Content_Types].xml",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
    '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
    '</Types>');
  zip.file("_rels/.rels",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
    '</Relationships>');
  zip.file("word/_rels/document.xml.rels",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
    '</Relationships>');
  zip.file("word/styles.xml",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
    '<w:docDefaults><w:rPrDefault><w:rPr>' +
    '<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>' +
    '<w:sz w:val="20"/><w:color w:val="000000"/>' +
    '</w:rPr></w:rPrDefault></w:docDefaults>' +
    '</w:styles>');
  zip.file("word/document.xml", generateDocxDocumentXml(tablesList));
  return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

// Process a single file end-to-end; returns a result object (never throws).
async function processOne(file) {
  var res = { name: file.name, ok: false, error: null, study: null, t1: null, t2: null, s1: null, changes: null, gate1: null, gate2: null };
  try {
    if (!/\.docx$/i.test(file.name)) throw new Error("Unsupported file type — upload a .docx TriNetX export.");
    var zip = await JSZip.loadAsync(await file.arrayBuffer());
    var doc = zip.file("word/document.xml");
    if (!doc) throw new Error("word/document.xml not found — not a TriNetX DOCX export?");
    var txt = T.docxTextFromXml(await doc.async("string"));
    var study = T.parseStudyText(txt);
    if (!study.phase_ns.before || !study.phase_ns.after)
      throw new Error("Could not locate the before/after characteristics tables. Is this a TriNetX 'Compare Outcomes' export?");
    var t1 = T.buildTable1(study);
    var t2 = T.buildTable2(study);
    var s1 = T.buildTableS1(study);
    var clean = JSON.parse(JSON.stringify(t1));
    var changes = T.suppressTable1(t1);
    var gate1 = T.verifyTable1(study, t1);
    var gate2 = T.verifySuppression(clean, t1, changes);
    res.qc = T.psmBalanceQC(study, t1);
    res.study = study; res.t1 = t1; res.t2 = t2; res.s1 = s1;
    res.changes = changes; res.gate1 = gate1; res.gate2 = gate2;
    res.ok = gate1[0] && gate2[0];
    if (!res.ok) res.error = gate1[1].concat(gate2[1]).slice(0, 8).join("; ");
  } catch (e) {
    res.error = (e && e.message) || String(e);
  }
  return res;
}

// Bulk: process many files, package all verified outputs into one ZIP.
async function handleFilesBulk(files) {
  outEl.innerHTML = "";
  setStatus('<div class="card">Processing <b>' + files.length + "</b> file(s) \u2026</div>");
  var outZip = new JSZip();
  var lines = [];
  var nOk = 0;
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    setStatus('<div class="card">Processing <b>' + esc(f.name) + "</b> (" + (i + 1) + "/" + files.length + ") \u2026</div>");
    var r = await processOne(f);
    var base = f.name.replace(/\.docx$/i, "");
    if (r.ok) {
      nOk++;
      var models = buildWordModels(r.t1, r.t2, r.s1, r.study);
      outZip.file(base + "_Table_1_and_2.docx", await docxBlob(models.t1t2));
      outZip.file(base + "_Table_S1.docx", await docxBlob(models.s1));
      lines.push("OK\t" + f.name);
    } else {
      lines.push("FAILED\t" + f.name + "\t" + (r.error || "verification failed"));
    }
  }
  outZip.file("_summary.txt",
    "TriNetX bulk table generation — " + new Date().toISOString() + "\n" +
    "Files processed: " + files.length + " | verified: " + nOk + " | failed: " + (files.length - nOk) + "\n\n" +
    lines.join("\n"));
  var blob = await outZip.generateAsync({ type: "blob", mimeType: "application/zip" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "TriNetX_Tables_bulk.zip";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);

  // On-screen summary
  setStatus("");
  var html = '<div class="card"><b>Bulk processing complete</b> &mdash; ' + nOk + " of " + files.length +
    " file(s) verified and packaged into <b>TriNetX_Tables_bulk.zip</b>.";
  if (files.length - nOk > 0) html += '<div class="err">' + esc(lines.filter(function (l) { return l.indexOf("FAILED") === 0; }).join("\n")) + "</div>";
  html += "</div>";
  outEl.innerHTML = html;
}

window.TriNetX.modelT1 = modelT1;
window.TriNetX.modelT2 = modelT2;
window.TriNetX.modelS1 = modelS1;
window.TriNetX.wordHtml = wordHtml;
window.TriNetX.buildDocxTableXml = buildDocxTableXml;
window.TriNetX.generateDocxDocumentXml = generateDocxDocumentXml;
window.TriNetX.WORD_W = WORD_W;
window.TriNetX.handleFile = handleFile;
window.TriNetX.downloadDocxFile = downloadDocxFile;
window.TriNetX.docxBlob = docxBlob;

var drop = document.getElementById("drop");
var input = document.getElementById("file");
var bulkBox = document.getElementById("bulkZip");

function routeFiles(fileList) {
  var files = Array.prototype.slice.call(fileList).filter(function (f) { return f; });
  if (!files.length) return;
  if ((bulkBox && bulkBox.checked) || files.length > 1) {
    handleFilesBulk(files);
  } else {
    handleFile(files[0]);
  }
}

input.addEventListener("change", function (e) { routeFiles(e.target.files); });
drop.addEventListener("dragover", function (e) { e.preventDefault(); });
drop.addEventListener("drop", function (e) {
  e.preventDefault();
  routeFiles(e.dataTransfer.files);
});
})();
</script>
